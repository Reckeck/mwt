# git-cliff: the commit part of CHANGELOG.md and the next version, both from
# the Conventional Commits that AGENTS.md requires. Used by
# `cargo xtask changelog` (`mise run changelog`) and
# `cargo xtask bump` (`mise run bump`) — not run directly.

[changelog]
# CHANGELOG.md keeps its own header; this renders one section's body.
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
#### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% if commit.breaking %} — **breaking**{% endif %} \
([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/Reckeck/mwt/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
# The boundary of "since the last release" is the tag on the tip of the release branch,
# `release-base/vX.Y.Z` (`cargo xtask release-start`): the release itself is squashed into main,
# so `vX.Y.Z` is not an ancestor of development. Pre-release tags (vX.Y.Z-N) are no boundary.
tag_pattern = "^release-base/v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Internal changes" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^(ci|build)", group = "<!-- 5 -->Build and CI" },
  { message = "^test", group = "<!-- 6 -->Tests" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", group = "<!-- 7 -->Other" },
]

[bump]
# 0.x: a feature raises the minor, anything else the patch; 1.0 is a decision,
# not something a «!» in a commit makes (`cargo xtask bump major` does it).
features_always_bump_minor = true
breaking_always_bump_major = false
# No release yet: the first release is this one (it has to match tag_pattern).
initial_tag = "release-base/v0.1.0"
