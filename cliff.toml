# git-cliff: the commit part of CHANGELOG.md and the next version, both from
# the Conventional Commits that AGENTS.md requires. Used by
# scripts/release/changelog.sh (`mise run changelog`) and
# scripts/release/bump.sh (`mise run bump`) — not run directly.

[changelog]
# CHANGELOG.md keeps its own header; this renders one section's body.
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
#### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% if commit.breaking %} — **несовместимо**{% endif %} \
([`{{ commit.id | truncate(length=7, end="") }}`](https://gitlab.com/Reckeck/trade-app/-/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
# Releases only: pre-release tags (vX.Y.Z-N) are not a boundary.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Добавлено" },
  { message = "^fix", group = "<!-- 1 -->Исправлено" },
  { message = "^perf", group = "<!-- 2 -->Быстрее" },
  { message = "^refactor", group = "<!-- 3 -->Изменено внутри" },
  { message = "^docs", group = "<!-- 4 -->Документация" },
  { message = "^(ci|build)", group = "<!-- 5 -->Сборка и CI" },
  { message = "^test", group = "<!-- 6 -->Тесты" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", group = "<!-- 7 -->Прочее" },
]

[bump]
# 0.x: a feature raises the minor, anything else the patch; 1.0 is a decision,
# not something a «!» in a commit makes (bump.sh major does it).
features_always_bump_minor = true
breaking_always_bump_major = false
# No release tag yet: the first release is this one.
initial_tag = "v0.1.0"
