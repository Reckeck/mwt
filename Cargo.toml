[workspace]
resolver = "3"
members = ["crates/core", "crates/app", "crates/plugin-saf"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://example.com/trade-app"

[workspace.lints.clippy]
# No single-letter identifiers: `i`, `j`, `x`, … are rejected everywhere.
# See clippy.toml for the threshold and the (empty) allow list.
min_ident_chars = "warn"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
bincode = { version = "2", features = ["serde"] }
rmp-serde = "1.3"
thiserror = "2"
rust_decimal = "1.43"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
zeroize = { version = "1", features = ["derive"] }
argon2 = { version = "0.5", features = ["std"] }
chacha20poly1305 = "0.10"
rand = "0.8"
aes = "0.8"
hmac = "0.12"
sha2 = "0.10"
pbkdf2 = { version = "0.12", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
tokio = { version = "1", features = ["full"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
ts-rs = { version = "9", features = ["serde-compat"] }
regex = "1"
# Device-to-device vault sync: Noise channel and LAN discovery.
snow = "0.10"
mdns-sd = "0.21"

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"

# The vault KDF (Argon2id, 64 MiB × 3) runs on every save. Unoptimized it is
# tens of times slower and dominated `cargo test`; optimizing just these crates
# keeps debug builds debuggable and changes no parameter.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
