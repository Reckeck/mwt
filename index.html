<!doctype html>
<html lang="ru" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Multi Wallet Tracker</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Theme and language before the first paint: the stylesheet arrives with the app code,
         and a dark theme must not start white (rule 17). The values mirror --background. -->
    <style>
      html { background: #f3f0e8; color-scheme: light; }
      html.dark { background: #111312; color-scheme: dark; }
    </style>
    <script>
      // Theme and language before the first paint: no white flash, no wrong hyphenation (TP4, CF3).
      ;(() => {
        try {
          // prepaint-table:start (generated by scripts/gen-prepaint-table.mjs)
          const TABLE = {"default-light":["#f3f0e8","light"],"default-dark":["#111312","dark"],"dracula":["#282a36","dark"],"alucard":["#fffbeb","light"],"nord":["#2e3440","dark"],"nord-snow-storm":["#eceff4","light"],"solarized-dark":["#002b36","dark"],"solarized-light":["#fdf6e3","light"],"gruvbox-dark":["#282828","dark"],"gruvbox-light":["#fbf1c7","light"],"catppuccin-mocha":["#1e1e2e","dark"],"catppuccin-macchiato":["#24273a","dark"],"catppuccin-frappe":["#303446","dark"],"catppuccin-latte":["#eff1f5","light"],"tokyo-night":["#1a1b26","dark"],"tokyo-night-storm":["#24283b","dark"],"tokyo-night-day":["#e1e2e7","light"],"one-dark":["#282c34","dark"],"one-light":["#fafafa","light"],"rose-pine":["#191724","dark"],"rose-pine-moon":["#232136","dark"],"rose-pine-dawn":["#faf4ed","light"],"everforest-dark":["#2d353b","dark"],"everforest-light":["#fdf6e3","light"],"kanagawa-wave":["#1f1f28","dark"],"kanagawa-lotus":["#f2ecbc","light"],"github-dark":["#0d1117","dark"],"github-light":["#ffffff","light"],"ayu-mirage":["#1f2430","dark"],"ayu-light":["#fcfcfc","light"]}
          // prepaint-table:end
          const root = document.documentElement
          const read = (key) => localStorage.getItem(`trade-app:${key}`)
          const hex = (value) => (/^#[0-9a-fA-F]{6}$/.test(value || '') ? value : null)
          const pref = localStorage.getItem('trade-app:theme') || 'auto'
          const systemDark = matchMedia('(prefers-color-scheme: dark)').matches
          const dark = pref === 'dark' || (pref === 'auto' && systemDark)
          const mode = dark ? 'dark' : 'light'
          const id = read(pref === 'auto' ? `theme-${mode}-id` : 'theme-id')
          const entry = TABLE[id] && TABLE[id][1] === mode ? TABLE[id] : TABLE[`default-${mode}`]
          // A custom theme mirrors its own canvas and text colour; they win over the table.
          const background = hex(read('theme-background')) || entry[0]
          const foreground = hex(read('theme-foreground'))
          root.classList.toggle('dark', dark)
          root.setAttribute('data-theme', mode)
          // Dropped by the first inline token (applyTheme sets --background on the root).
          const canvas = document.createElement('style')
          canvas.dataset.prepaint = ''
          canvas.textContent = `html:not([style*="--background"]) { background: ${background}; color-scheme: ${mode};${
            foreground ? ` color: ${foreground};` : ''
          } }`
          document.head.appendChild(canvas)
          root.style.colorScheme = mode
          // The Linux window (WebKitGTK): overlays open without animation there, see styles.css.
          const ua = navigator.userAgent
          if (/Linux/.test(ua) && /AppleWebKit/.test(ua) && !/Chrome|Chromium|Android/.test(ua)) {
            root.dataset.engine = 'webkitgtk'
          }
          const lang = localStorage.getItem('trade-app:locale')
          if (lang === 'ru' || lang === 'en') root.lang = lang
        } catch {
          // Storage blocked: the app sets both once it starts.
        }
      })()
    </script>
  </head>
  <body class="h-full antialiased">
    <div id="app" class="h-full"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
