[package]
name = "mwt-workflow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Multi Wallet Tracker workflow: the node catalog, graph, validation, executor and the pure record, run, mark and variable rules (depends on mwt-model and mwt-base only)"

[lints]
workspace = true

[features]
# The derives of this crate name model and base types, so both features forward to them.
ts = ["dep:ts-rs", "mwt-base/ts", "mwt-model/ts"]
schema = ["dep:schemars", "mwt-base/schema", "mwt-model/schema"]

[dependencies]
mwt-base = { path = "../base" }
mwt-model = { path = "../model" }
serde.workspace = true
serde_json.workspace = true
rust_decimal.workspace = true
uuid.workspace = true
chrono.workspace = true
regex.workspace = true
ts-rs = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }

[dev-dependencies]
insta.workspace = true
pretty_assertions.workspace = true
