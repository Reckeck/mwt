[package]
name = "mwt-workflow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Multi Wallet Tracker workflow: the node catalog, graph, validation, executor and the pure record, run, mark and variable rules (depends on mwt-model and mwt-base only)"

[lints]
workspace = true

[dependencies]
# The derives of model and base are always on here: this crate derives `TS`/`JsonSchema` over their types.
mwt-base = { path = "../base", features = ["ts", "schema"] }
mwt-model = { path = "../model", features = ["ts", "schema"] }
serde.workspace = true
serde_json.workspace = true
rust_decimal.workspace = true
uuid.workspace = true
chrono.workspace = true
regex.workspace = true
ts-rs.workspace = true
schemars.workspace = true

[dev-dependencies]
insta.workspace = true
pretty_assertions.workspace = true
