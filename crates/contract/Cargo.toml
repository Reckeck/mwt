[package]
name = "mwt-contract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Multi Wallet Tracker IPC contract: the command input/output types shared with the frontend (sits on top of the domain crates; nothing below names it)"

[lints]
workspace = true

[features]
# The derives of this crate name types of every crate below, so both features forward to them.
ts = ["dep:ts-rs", "mwt-base/ts", "mwt-model/ts", "mwt-sync/ts", "mwt-money/ts", "mwt-household/ts", "mwt-planning/ts", "mwt-reports/ts", "mwt-cryptotrack/ts", "mwt-crypto/ts", "mwt-workflow/ts", "mwt-net/ts"]
schema = ["mwt-base/schema", "mwt-model/schema", "mwt-money/schema", "mwt-planning/schema", "mwt-reports/schema", "mwt-cryptotrack/schema", "mwt-workflow/schema"]

[dependencies]
mwt-base = { path = "../base" }
mwt-model = { path = "../model" }
mwt-money = { path = "../money" }
mwt-household = { path = "../household" }
mwt-planning = { path = "../planning" }
mwt-reports = { path = "../reports" }
mwt-cryptotrack = { path = "../cryptotrack" }
mwt-workflow = { path = "../workflow" }
mwt-sync = { path = "../sync" }
mwt-crypto = { path = "../crypto" }
mwt-vault = { path = "../vault" }
mwt-net = { path = "../net" }
serde.workspace = true
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
