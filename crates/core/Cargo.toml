[package]
name = "trade-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Multi Wallet Tracker core: domain model, encrypted vault, pricing, market data (no Tauri deps)"

[lints]
workspace = true

[features]
# Test kit (`crate::testkit`); becomes its own crate later.
testkit = []
# Forwarded to every extracted crate that has them (`mwt-base`, `mwt-crypto` and `mwt-model` are always built with them here).
ts = ["mwt-model/ts"]
schema = ["mwt-model/schema"]
# Marks every `forward!` delegate `#[deprecated]` so the remaining callers can be listed (`cargo clippy --features deprecated-forwards`).
deprecated-forwards = []

[dependencies]
# The model: its derives are always on here, like base.
mwt-model = { path = "../model", features = ["ts", "schema"] }
# The DTO derives of base are always on here: this crate derives `TS`/`JsonSchema` over `Amount`.
mwt-base = { path = "../base", features = ["ts", "schema"] }
# The network layer: pricing, exchanges, data sources, market, updates, external links.
mwt-net = { path = "../net" }
# `SecurityLevel` / `RaiseStage` are TS types of the IPC contract.
mwt-crypto = { path = "../crypto", features = ["ts"] }
serde.workspace = true
serde_json.workspace = true
rmp-serde.workspace = true
thiserror.workspace = true
rust_decimal.workspace = true
uuid.workspace = true
base64 = "0.23"
time.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
zeroize.workspace = true
hmac.workspace = true
sha2.workspace = true
blake2.workspace = true
rand.workspace = true
reqwest.workspace = true
tokio.workspace = true
schemars.workspace = true
ts-rs.workspace = true
regex.workspace = true
snow.workspace = true
spake2.workspace = true
serde_bytes.workspace = true

[dev-dependencies]
mwt-crypto = { path = "../crypto", features = ["ts", "testing"] }
tempfile = "3"
insta.workspace = true
proptest.workspace = true
pretty_assertions.workspace = true

[[bin]]
name = "gen-types"
path = "src/bin/gen_types.rs"