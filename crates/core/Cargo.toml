[package]
name = "trade-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Multi Wallet Tracker core facade: re-exports of mwt-usecases (no Tauri deps)"

[lints]
workspace = true

[features]
# Forwarded to the use-case crate (which forwards it down).
ts = ["mwt-usecases/ts"]
schema = ["mwt-usecases/schema"]

[dependencies]
# Everything the facade re-exports: the scenarios, the service shim, sandbox, app config, the IPC contract shim.
mwt-usecases = { path = "../usecases" }
