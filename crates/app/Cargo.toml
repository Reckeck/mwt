[package]
name = "trade-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "TradeApp — encrypted finance & crypto portfolio (Tauri shell over trade-core)"

[lib]
name = "trade_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "trade-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = { workspace = true }
trade-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
time.workspace = true
chrono.workspace = true
zeroize.workspace = true
reqwest.workspace = true
schemars.workspace = true
ts-rs.workspace = true
tauri-plugin-notification = "2"
iana-time-zone = "0.1"
chacha20poly1305.workspace = true
rand.workspace = true

# Desktop-only: tray, autostart, global keys, window geometry and the OS keyring
# have no Android/iOS counterpart (`cfg(desktop)` in the code).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2.5.0"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "apple-native", "windows-native"] }

[dev-dependencies]
tempfile = "3"
