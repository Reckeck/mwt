[package]
name = "trade-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Multi Wallet Tracker (MWT) — encrypted finance & crypto portfolio (Tauri shell over trade-core)"

[lib]
name = "trade_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "multi-wallet-tracker"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
base64 = "0.22"
tauri-plugin-dialog = { workspace = true }
tauri-plugin-fs = { workspace = true }
trade-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
time.workspace = true
chrono.workspace = true
zeroize.workspace = true
reqwest.workspace = true
schemars.workspace = true
ts-rs.workspace = true
tauri-plugin-notification = "2"
iana-time-zone = "0.1"
chacha20poly1305.workspace = true
rand.workspace = true
# Device-to-device vault sync on the local network (src/sync).
mdns-sd.workspace = true
if-addrs = "0.15"
rmp-serde.workspace = true

# Android-only: document pickers with a grant that survives a restart
# (the external copy of a vault, `platform_fs`).
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-saf = { path = "../plugin-saf" }
# LAN sync: multicast lock and the Keystore-wrapped device key (src/platform_net.rs).
tauri-plugin-net = { path = "../plugin-net" }
# System bars: inset CSS variables, icon colour, minimise on Back (src/commands/mobile.rs).
tauri-plugin-insets = { path = "../plugin-insets" }

# Desktop-only: tray, autostart, global keys, window geometry and the OS keyring
# have no Android/iOS counterpart (`cfg(desktop)` in the code).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2.5.0"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "apple-native", "windows-native"] }
# Moving the TradeApp-era directories and autostart entry (src/legacy.rs).
dirs = "7"
auto-launch = "0.5"

[dev-dependencies]
tempfile = "3"
