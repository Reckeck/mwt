[package]
name = "mwt-household"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Multi Wallet Tracker household: attachments, contacts, debts, losses, loyalty, property links, relations, shared events, utilities and vehicles (depends on mwt-money, mwt-model and mwt-base only)"

[lints]
workspace = true

[features]
# `ts-rs` derives of the household view and input types; off by default, `mwt-usecases` turns them on.
ts = ["dep:ts-rs", "mwt-model/ts", "mwt-base/ts", "mwt-money/ts"]

[dependencies]
mwt-base = { path = "../base" }
mwt-model = { path = "../model" }
mwt-money = { path = "../money" }
serde.workspace = true
serde_json.workspace = true
rust_decimal.workspace = true
uuid.workspace = true
chrono.workspace = true
time.workspace = true
base64 = "0.23"
sha2.workspace = true
zeroize.workspace = true
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
mwt-testkit = { path = "../testkit" }
proptest.workspace = true
pretty_assertions.workspace = true
insta.workspace = true
