# Baseline of `cargo xtask check arch`: back edges that exist today, by file (under crates/core/src) and
# target module. `until` names the task that removes the edge (T4-T14 of core-edges) or the phase (Ф5).
# A violation outside this list fails with file:line; an entry that matches nothing only warns
# (T15 deletes the stale ones and makes them an error). Edge tasks do not edit this file.
allow = [
    { from = "calendar.rs", to = "pricing", until = "T5" },
    { from = "calendar/period.rs", to = "model", until = "T6" },
    { from = "calendar/workdays.rs", to = "pricing", until = "T5" },
