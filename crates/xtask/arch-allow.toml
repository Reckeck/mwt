    { from = "error.rs", to = "model", until = "T4" },
    { from = "error.rs", to = "service", until = "T4" },
    { from = "kernel/books.rs", to = "service", until = "Ф5" },
    { from = "kernel/collection.rs", to = "sync", until = "T10" },
    { from = "kernel/persistence.rs", to = "service", until = "Ф5" },
