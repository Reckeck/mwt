# Baseline of `cargo xtask check arch`: back edges allowed for now, by file (under crates/core/src) and
# target module. Each entry names the phase that removes it (`until`) and why it stays (`reason`).
# A back edge outside this list fails with file:line; an entry that matches nothing fails too: delete it.
# To allow a new edge, add an entry with `until` and a reason in the PR.
allow = [
    { from = "kernel/books.rs", to = "service", until = "Ф5", reason = "the kernel still calls service while the write path moves out of it" },
    { from = "kernel/persistence.rs", to = "service", until = "Ф5", reason = "the kernel still calls service while the write path moves out of it" },
    { from = "workflow/exec.rs", to = "service", until = "Ф5", reason = "workflow nodes call service until the node ports exist" },
    { from = "workflow/nodes/actions.rs", to = "service", until = "Ф5", reason = "workflow nodes call service until the node ports exist" },
    { from = "reports/overview.rs", to = "service", until = "Ф5", reason = "the reports area still reads budget flows, rate books, insights and the loss and where-it-went reports from service until those areas move to their groups" },
    { from = "reports/overview.rs", to = "usecases", until = "Ф5", reason = "leg_value_in lives in usecases/planning/budget.rs (stream D); reports read it until the pricing helper moves to a lower layer" },
    { from = "household/shared_events/mod.rs", to = "ipc_contract", until = "Ф5", reason = "the plan functions take the request inputs of the shared events commands; the input types stay in ipc_contract until the contract moves" },
    { from = "household/shared_events/settle.rs", to = "ipc_contract", until = "Ф5", reason = "the settle plans take the request inputs of the shared events commands; the input types stay in ipc_contract until the contract moves" },
    { from = "household/shared_events/purchases.rs", to = "ipc_contract", until = "Ф5", reason = "the purchase plans take the request inputs of the shared events commands; the input types stay in ipc_contract until the contract moves" },
    { from = "kernel/books.rs", to = "money", until = "Ф5", reason = "Books computes the shared-event ratios and extras through money::shared_ratios (T33) until the kernel is re-layered" },
    { from = "money/shared_ratios.rs", to = "household", until = "Ф5", reason = "the shared-event figures need the event split from household/shared_events until the split moves below money (follow-up T135)" },
    { from = "reports/where_went.rs", to = "service", until = "Ф5", reason = "where_went reads the rate book and flow classes from service until rates and budget flows move to their groups" },
    { from = "reports/notify_snapshot.rs", to = "service", until = "Ф5", reason = "the notification snapshot reads the agenda, category_of and the notice texts from service until stream D moves notifications and agenda (T43)" },
    { from = "reports/insights.rs", to = "usecases", until = "Ф5", reason = "insights read loss_report (household) and lifestyle_creep (planning) until those queries move to a lower layer" },
    { from = "reports/dashboard.rs", to = "ipc_contract", until = "Ф5", reason = "dashboard figures carry Comparison and BaseKind from ipc_contract until the comparison type moves to a lower layer" },
    { from = "reports/dashboard_tiles.rs", to = "ipc_contract", until = "Ф5", reason = "dashboard figures carry Comparison and BaseKind from ipc_contract until the comparison type moves to a lower layer" },
    { from = "reports/dashboard_today.rs", to = "ipc_contract", until = "Ф5", reason = "dashboard figures carry Comparison and BaseKind from ipc_contract until the comparison type moves to a lower layer" },
    { from = "reports/dashboard.rs", to = "service", until = "Ф5", reason = "reads FlowClass from service until budget flows move to their groups" },
    { from = "reports/dashboard_tiles.rs", to = "service", until = "Ф5", reason = "reads FlowClass from service until budget flows move to their groups" },
    { from = "reports/dashboard_today.rs", to = "service", until = "Ф5", reason = "reads UpcomingKind from service until stream D moves the agenda (T43)" },
    { from = "storage/legacy_v4/adopt.rs", to = "cryptotrack", until = "v4 transition removed", reason = "the frozen one-time conversion of the old Bybit queue reuses the crypto math, prices and Bybit chain id; it goes away with the v4 transition" },
    { from = "storage/legacy_v4/adopt.rs", to = "exchange", until = "v4 transition removed", reason = "the frozen one-time conversion registers coins through exchange::well_known_coin; it goes away with the v4 transition" },
    { from = "storage/legacy_v4/graph.rs", to = "workflow", until = "v4 transition removed", reason = "the frozen graph steps 1-3 stamp graphs with the live GRAPH_VERSION; they go away with the v4 transition" },
    { from = "cryptotrack/exchange_sync.rs", to = "money", until = "Ф6", reason = "cryptotrack reads store trees, price quotes and historical prices from money instead of Books::vault (T58); the layer table keeps cryptotrack beside money until Ф6 places it above money (follow-up T201)" },
    { from = "cryptotrack/service/positions.rs", to = "money", until = "Ф6", reason = "cryptotrack reads store trees, price quotes and historical prices from money instead of Books::vault (T58); the layer table keeps cryptotrack beside money until Ф6 places it above money (follow-up T201)" },
    { from = "cryptotrack/service/recompute.rs", to = "money", until = "Ф6", reason = "cryptotrack reads store trees, price quotes and historical prices from money instead of Books::vault (T58); the layer table keeps cryptotrack beside money until Ф6 places it above money (follow-up T201)" },
    { from = "cryptotrack/service/totals.rs", to = "money", until = "Ф6", reason = "cryptotrack reads store trees, price quotes and historical prices from money instead of Books::vault (T58); the layer table keeps cryptotrack beside money until Ф6 places it above money (follow-up T201)" },
]
