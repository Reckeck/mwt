# Area map of the core-strangler phase (spec trade-app.core-strangler, table F2, D1, D5).
#
# One [[area]] per row of F2. `files` are paths under `service_dir` (a trailing `/` takes the whole
# directory); `regions` cut a part of a shared file between two marker lines (the first line that
# starts with `from`, up to but not including the first line that starts with `to`), so they survive
# line drift. `group` is the target module group (`<group>/<area>.rs`), `context` the scenario home
# (`usecases/<context>/<area>.rs`), `task` the owner label: the plan task for the pilot and the
# foundations, the stream letter (A-E) for the area moves (a wave of one stream may touch several of its
# areas in one PR, rule 5 of `strangle check`). One area holds the service files of one plan task.
# `homes` overrides the group of single files whose target-structure home differs from the area's.
# `stubs = false` keeps an area out of `scaffold`; `ipc_contract = true` gives it an `ipc_contract/<area>.rs` stub.

service_dir = "crates/core/src/service"
command_dir = "crates/app/src"
scan_dirs = ["crates/core/src", "crates/core/tests", "crates/app/src"]

# Files every area task may change besides its own (spec D5).
grants = ["crates/core/src/bin/gen_types.rs"]

# Shared files no area task may change: only a foundation task that lists them (or a grant) may.
guarded = [
    "crates/core/src/lib.rs",
    "crates/core/src/ipc_contract.rs",
    "crates/core/src/kernel/events.rs",
    "crates/core/src/service/golden_tests.rs",
    "crates/core/src/service/test_support.rs",
    "crates/core/src/kernel/golden_tests.rs",
    "crates/app/src/",
]

# The foundation tasks that change files inside `service/`, the group dirs or `usecases/`.
[[foundation]]
task = "T5"
files = ["crates/core/src/service/forward.rs", "crates/core/src/service/mod.rs"]

[[foundation]]
# Stream E declares its reactions runner and the workflow reactions in the two module lists.
task = "E"
files = ["crates/core/src/usecases/mod.rs", "crates/core/src/usecases/workflow/mod.rs"]

[[foundation]]
# Stream E adds what the workflow reactions need to two planning event payloads (zone, workflow_ids); nothing emits them until T44.
task = "E"
files = ["crates/core/src/kernel/events.rs"]

[[foundation]]
# Stream D adds the moment of the user's action (at) to the retry and pause/resume events and the stopped ids to GoalPaused.
task = "D"
files = ["crates/core/src/kernel/events.rs"]

[[foundation]]
# Stream D: the workflow reactions read the event's moment instead of the clock.
task = "D"
files = ["crates/core/src/usecases/workflow/reactions.rs"]

[[foundation]]
# Stream D: the reaction tests build the retry and pause/resume events with the new `at` and `workflow_ids` fields.
task = "D"
files = ["crates/core/src/usecases/react_tests.rs"]

[[foundation]]
# Stream D: tests that the planning scenarios emit the automation and goal events (observed through the reactions).
task = "D"
files = ["crates/core/src/planning/events_tests.rs"]

[[foundation]]
# The module wiring `scaffold` writes; the area stubs belong to their area tasks.
task = "T6"
files = [
    "crates/core/src/lib.rs",
    "crates/core/src/ipc_contract.rs",
    "crates/core/src/usecases/mod.rs",
    "crates/core/src/cryptotrack/mod.rs",
    "crates/core/src/household/mod.rs",
    "crates/core/src/money/mod.rs",
    "crates/core/src/planning/mod.rs",
