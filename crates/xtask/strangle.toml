[[foundation]]
# `sync_ids` and `reports` become `pub(crate)` for the household scenarios until their areas move.
task = "A"
files = ["crates/core/src/service/mod.rs"]

[[foundation]]
# Merge of stream B (#160): the `iso_of` re-export in the rates shim lost its last user (service/losses.rs moved).
task = "A"
files = ["crates/core/src/service/rates.rs"]

[[foundation]]
# `sync_ids` becomes `pub(crate)` for the money scenarios that mint deterministic ids.
task = "B"
files = ["crates/core/src/service/mod.rs"]

[[foundation]]
# `sync_ids` becomes `pub(crate)` for the household scenarios that mint deterministic ids.
task = "C"
files = ["crates/core/src/service/mod.rs"]

[[foundation]]
# `MIN_HISTORY_MONTHS` of the budget shim is re-exported `pub(crate)` for the goals scenarios until T41 moves the budget;
# the planning module list gets `automation_rules`; the workflow reaction on a paused goal reads `goal_savers` from its scenario module.
task = "D"
files = [
    "crates/core/src/service/mod.rs", "crates/core/src/usecases/planning/mod.rs",
    "crates/core/src/usecases/workflow/reactions.rs",
]

[[foundation]]
