# Checks of every PR into development/main. A push to them is checked by release.yml, which
# calls this workflow (workflow_call) before it builds anything: the same lanes, run once.
#
#   images          the CI images in ghcr (images.yml), built only when their tag is new
#   xtask           the xtask binary, built once (linux in ci-linux, windows natively) and handed to every
#                   job as an artifact (bin/xtask): the jobs below never compile xtask themselves
#   deps-node       node_modules, installed once per pnpm-lock.yaml and saved on a miss (in ci-node); the
#                   frontend jobs only restore it (and fail on a miss)
#   deps            a lane's dependency cache (sccache dir), written ONLY here and only when
#                   the lane has no cache for its key yet; everything else just reads it
#   check-linux     bin/xtask check --exclude @frontend --exclude @platforms in ci-linux: fmt, clippy, tests, gen-types
#   frontend-static bin/xtask check @static in ci-node: lint, typecheck, vitest, static checks
#   frontend-e2e    bin/xtask check @browser --exclude layout --exclude links in ci-node: e2e
#   frontend-layout bin/xtask check layout links (full by default) in ci-node, a matrix of 6 shards of their units
#   check-android   bin/xtask check platform:android in ci-android (NDK in the image)
#   clippy-windows  native clippy on windows-latest        } xtask's platform:windows/macos need
#   clippy-macos    cargo xtask check platform:macos       } cargo-xwin / a Mac: left out of check-linux
#   ci-ok           the one job branch protection requires
#
# Cache keys, who writes and who reads: see `xtask lane-key` (crates/xtask/src/cache/lane_key.rs)
# and the job comments below. A cache is visible to its own ref, the PR's base branch and the
# default branch (development) only, so feature branches are checked through PRs.
# main runs without caches (releases build from scratch).
name: ci

on:
  pull_request:
    branches: [development, main]
  workflow_dispatch:
  workflow_call:
    outputs:
      tag:
        description: CI image tag (images.yml), for the jobs that run in the images
        value: ${{ jobs.images.outputs.tag }}
      base:
        description: Registry path of the CI images
        value: ${{ jobs.images.outputs.base }}

# Newer runs of the same PR/branch replace older ones; main always finishes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  # Debug info is not needed to check or test; smaller objects, faster links.
  CARGO_PROFILE_DEV_DEBUG: "0"
  # About 1 GB per lane (10 GB for the repository, one cache per lane and ref).
  SCCACHE_CACHE_SIZE: 1G

jobs:
  images:
    uses: ./.github/workflows/images.yml
    permissions:
      contents: read
      packages: write

  # ------------------------------------------------------------------ xtask
  # xtask compiled once per platform; every job below downloads it into bin/ instead of running
  # `cargo xtask`. The Linux binary is built in ci-linux (ubuntu 22.04, as ci-node and ci-android
  # are), so it runs in all of them. The artifacts are not called `xtask`: release.yml calls this
  # workflow in the same run and already uploads an artifact of that name.
  xtask:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ${{ needs.images.outputs.base }}/ci-linux:${{ needs.images.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    env:
      MISE_DATA_DIR: /opt/mise
      MISE_YES: "1"
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The job that builds xtask has no xtask yet: the one shell line `xtask ci-container-env --cargo` replaces.
      - name: Toolchain from the image
        run: printf '%s\n' /opt/mise/shims /opt/cargo/bin >>"$GITHUB_PATH" && mise trust "$GITHUB_WORKSPACE/mise.toml"
      - name: Compiled xtask dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/xtask-target
          key: xtask-linux-${{ hashFiles('Cargo.lock', 'crates/xtask/**', 'mise.toml', '.cargo/config.toml') }}
      # The flag wins over target-dir of .cargo/config.toml and over CARGO_TARGET_DIR of mise.toml.
      # A static (musl) binary: it also runs in the archlinux and Ubuntu containers the builds
      # mount it into, not only in the images of the jobs.
      - name: Build xtask
        run: rustup target add x86_64-unknown-linux-musl && cargo build -p xtask --locked --target x86_64-unknown-linux-musl --target-dir .cache/xtask-target
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xtask-linux
          path: .cache/xtask-target/x86_64-unknown-linux-musl/debug/xtask
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  xtask-windows:
    needs: images
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Rust as mise.toml pins it (no version in this file).
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: rust
          cache: false
      - name: Compiled xtask dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/xtask-target
          key: xtask-windows-${{ hashFiles('Cargo.lock', 'crates/xtask/**', 'mise.toml', '.cargo/config.toml') }}
      - name: Build xtask
        run: cargo build -p xtask --locked --target-dir .cache/xtask-target
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xtask-windows
          path: .cache/xtask-target/debug/xtask.exe
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  # ------------------------------------------------------------------ deps-node
  # node_modules once per key (pnpm-lock.yaml, manifests, image, node/pnpm versions): a lookup, and
  # only a miss installs, saves and deletes the older caches of this ref. The frontend jobs restore
  # exactly this key and fail if it is missing; they never install.
  deps-node:
    needs: [images, xtask]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      key: ${{ steps.key.outputs.key }}
    container:
      image: ${{ needs.images.outputs.base }}/ci-node:${{ needs.images.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
      actions: write # delete the older caches
    env:
      MISE_DATA_DIR: /opt/mise
      MISE_YES: "1"
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      CI_IMAGE_TAG: ${{ needs.images.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: xtask-linux
          path: bin
      - name: Make xtask executable
        run: chmod +x bin/xtask
      - name: Toolchain from the image
        run: bin/xtask ci-container-env
      - name: Cache key
        id: key
        run: echo "key=$(bin/xtask lane-key node)" >>"$GITHUB_OUTPUT"
      - name: Is node_modules cached
        id: lookup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - name: pnpm install
        if: steps.lookup.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - name: Save node_modules
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ steps.key.outputs.key }}
      - name: Delete the older node_modules caches on this ref
        if: steps.lookup.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bin/xtask deps-prune node '${{ steps.key.outputs.key }}'

  # ------------------------------------------------------------------ deps
  # Lookup-only by the lane key; a hit ends the job. A miss: seed from the newest older
  # cache of the lane (prefix match: sccache is content-addressed, stale entries are
  # harmless), compile ONLY the dependencies (cargo-chef, our crates are stubs), save under
  # the new key into this ref and delete the older cache of this lane on this ref.
  deps:
    needs: [images, xtask]
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lane: check-linux, image: ci-linux }
          - { lane: clippy-android, image: ci-android }
    container:
      image: ${{ needs.images.outputs.base }}/${{ matrix.image }}:${{ needs.images.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
      actions: write # delete the lane's older caches
    env:
      MISE_DATA_DIR: /opt/mise
      MISE_YES: "1"
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      CI_IMAGE_TAG: ${{ needs.images.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: xtask-linux
          path: bin
      - name: Make xtask executable
        run: chmod +x bin/xtask
      - name: Toolchain from the image
        run: bin/xtask ci-container-env --cargo
      - name: Cache key
        id: key
        run: echo "key=$(bin/xtask lane-key '${{ matrix.lane }}')" >>"$GITHUB_OUTPUT"
      - name: Is the lane cached
        id: lookup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/sccache
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - name: Environment
        if: steps.lookup.outputs.cache-hit != 'true'
        run: bin/xtask ci-env
      - name: Seed from the lane's previous cache
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/sccache
          key: ${{ steps.key.outputs.key }}
          restore-keys: ${{ matrix.lane }}-
      - name: Compile the dependencies
        if: steps.lookup.outputs.cache-hit != 'true'
        run: bin/xtask deps-cook '${{ matrix.lane }}'
      - name: Save the lane cache
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/sccache
          key: ${{ steps.key.outputs.key }}
      - name: Delete the lane's older caches on this ref
        if: steps.lookup.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bin/xtask deps-prune '${{ matrix.lane }}' '${{ steps.key.outputs.key }}'

  # Windows lanes run the prebuilt xtask.exe; macOS (paused) has no binary and compiles it (`cargo xtask`).
  deps-native:
    needs: [images, xtask-windows]
    if: github.ref != 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lane: clippy-windows, os: windows-latest, xtask: bin/xtask.exe }
          # Paused for now, like the clippy-macos job: { lane: clippy-macos, os: macos-latest, xtask: cargo xtask }
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Rust as mise.toml pins it (no version in this file).
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: rust
          cache: false
      - name: clippy component
        run: rustup component add clippy
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: sccache@0.19.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.os == 'windows-latest'
        with:
          name: xtask-windows
          path: bin
      - name: Cache key
        id: key
        run: echo "key=$(${{ matrix.xtask }} lane-key '${{ matrix.lane }}')" >>"$GITHUB_OUTPUT"
      - name: Is the lane cached
        id: lookup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/sccache
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - name: cargo-chef
        if: steps.lookup.outputs.cache-hit != 'true'
        run: ${{ matrix.xtask }} install-chef
      - name: Environment
        if: steps.lookup.outputs.cache-hit != 'true'
        run: ${{ matrix.xtask }} ci-env
      - name: Seed from the lane's previous cache
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/sccache
          key: ${{ steps.key.outputs.key }}
          restore-keys: ${{ matrix.lane }}-
      - name: Compile the dependencies
        if: steps.lookup.outputs.cache-hit != 'true'
        run: ${{ matrix.xtask }} deps-cook '${{ matrix.lane }}'
      - name: Save the lane cache
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/sccache
          key: ${{ steps.key.outputs.key }}
      - name: Delete the lane's older caches on this ref
        if: steps.lookup.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ${{ matrix.xtask }} deps-prune '${{ matrix.lane }}' '${{ steps.key.outputs.key }}'

  # ------------------------------------------------------------------ checks
  # `deps` is skipped on main (no caches there); any other result than success/skipped stops the check.
  check-linux:
    needs: [images, xtask, deps]
    if: ${{ !cancelled() && needs.images.result == 'success' && needs.xtask.result == 'success' && (needs.deps.result == 'success' || needs.deps.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ${{ needs.images.outputs.base }}/ci-linux:${{ needs.images.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    env:
      MISE_DATA_DIR: /opt/mise
      MISE_YES: "1"
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      CI_IMAGE_TAG: ${{ needs.images.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: xtask-linux
          path: bin
      - name: Make xtask executable
        run: chmod +x bin/xtask
      - name: Toolchain from the image
        run: bin/xtask ci-container-env --cargo
      - name: Environment
        run: bin/xtask ci-env
      - name: Cache key
        id: key
        run: echo "key=$(bin/xtask lane-key check-linux)" >>"$GITHUB_OUTPUT"
      - name: Dependencies (read-only lane cache)
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/sccache
          key: ${{ steps.key.outputs.key }}
      - name: xtask check
        run: bin/xtask check --exclude @frontend --exclude @platforms
      - name: sccache stats
        if: always()
        run: sccache --show-stats | grep -E '^(Compile requests|Cache hits|Cache misses) ' || true
      - name: Logs and screenshots of a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-linux-logs
          path: |
            .cache/xtask/
          retention-days: 7
          if-no-files-found: ignore

  # The web part in ci-node (node, pnpm, Chrome, no Rust): xtask comes as a binary and runs no cargo here.
  frontend-static:
    needs: [images, xtask, deps-node]
    if: ${{ !cancelled() && needs.images.result == 'success' && needs.xtask.result == 'success' && needs.deps-node.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ${{ needs.images.outputs.base }}/ci-node:${{ needs.images.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    env:
      MISE_DATA_DIR: /opt/mise
      MISE_YES: "1"
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: xtask-linux
          path: bin
      - name: Make xtask executable
        run: chmod +x bin/xtask
      - name: Toolchain from the image
        run: bin/xtask ci-container-env
      # node_modules from deps-node; never installed here.
      - name: node_modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ needs.deps-node.outputs.key }}
          fail-on-cache-miss: true
      - name: xtask check @static
        run: bin/xtask check @static
      - name: Logs and screenshots of a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-static-logs
          path: |
            .cache/xtask/
          retention-days: 7
          if-no-files-found: ignore

  frontend-e2e:
    needs: [images, xtask, deps-node]
    if: ${{ !cancelled() && needs.images.result == 'success' && needs.xtask.result == 'success' && needs.deps-node.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ${{ needs.images.outputs.base }}/ci-node:${{ needs.images.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # Chrome needs more than Docker's 64 MB /dev/shm.
      options: --shm-size=2g
    permissions:
      contents: read
      packages: read
    env:
      MISE_DATA_DIR: /opt/mise
      MISE_YES: "1"
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: xtask-linux
          path: bin
      - name: Make xtask executable
        run: chmod +x bin/xtask
      - name: Toolchain from the image
        run: bin/xtask ci-container-env
      # node_modules from deps-node; never installed here.
      - name: node_modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ needs.deps-node.outputs.key }}
          fail-on-cache-miss: true
      # @browser minus the sharded layout/links of frontend-layout: a new browser task lands here.
      - name: xtask check @browser --exclude layout --exclude links
        run: bin/xtask check @browser --exclude layout --exclude links
      - name: Logs and screenshots of a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-e2e-logs
          path: |
            .cache/xtask/
            .cache/e2e/
          retention-days: 7
          if-no-files-found: ignore

  # check-layout and check-links in full (every width, both themes), cut into SHARDS shares of the units by their
  # weights (tests/e2e/{layout,links}/weights.json): each matrix job runs its share, `--jobs 1` (2 vCPU runners).
  frontend-layout:
    needs: [images, xtask, deps-node]
    if: ${{ !cancelled() && needs.images.result == 'success' && needs.xtask.result == 'success' && needs.deps-node.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    container:
      image: ${{ needs.images.outputs.base }}/ci-node:${{ needs.images.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # Chrome (check-layout) needs more than Docker's 64 MB /dev/shm.
      options: --shm-size=2g
    permissions:
      contents: read
      packages: read
    env:
      MISE_DATA_DIR: /opt/mise
      MISE_YES: "1"
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: xtask-linux
          path: bin
      - name: Make xtask executable
        run: chmod +x bin/xtask
      - name: Toolchain from the image
        run: bin/xtask ci-container-env
      # node_modules from deps-node; never installed here.
      - name: node_modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ needs.deps-node.outputs.key }}
          fail-on-cache-miss: true
      - name: xtask check layout links (shard ${{ matrix.shard }}/6)
        run: bin/xtask check layout links --shard ${{ matrix.shard }}/6 --jobs 1
      - name: Logs and screenshots of a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-layout-${{ matrix.shard }}-logs
          path: |
            .cache/xtask/
            .cache/check-layout/
            .cache/check-links/
            .cache/e2e/
          retention-days: 7
          if-no-files-found: ignore

  # What xtask's platform:android does in podman on a developer machine, minus podman:
  # in the ci-android image the NDK and the Rust Android targets are on the host, which
  # is the path xtask takes first (platforms.rs: android()).
  check-android:
    needs: [images, xtask, deps]
    if: ${{ !cancelled() && needs.images.result == 'success' && needs.xtask.result == 'success' && (needs.deps.result == 'success' || needs.deps.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ${{ needs.images.outputs.base }}/ci-android:${{ needs.images.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    env:
      MISE_DATA_DIR: /opt/mise
      MISE_YES: "1"
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      CI_IMAGE_TAG: ${{ needs.images.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: xtask-linux
          path: bin
      - name: Make xtask executable
        run: chmod +x bin/xtask
      - name: Toolchain from the image
        run: bin/xtask ci-container-env --cargo
      - name: Environment
        run: bin/xtask ci-env
      - name: Cache key
        id: key
        run: echo "key=$(bin/xtask lane-key clippy-android)" >>"$GITHUB_OUTPUT"
      - name: Dependencies (read-only lane cache)
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/sccache
          key: ${{ steps.key.outputs.key }}
      - name: xtask check platform:android
        run: bin/xtask check platform:android
      - name: sccache stats
        if: always()
        run: sccache --show-stats | grep -E '^(Compile requests|Cache hits|Cache misses) ' || true
      - name: Logs of a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-android-logs
          path: .cache/xtask/
          retention-days: 7
          if-no-files-found: ignore

  clippy-windows:
    needs: [images, xtask-windows, deps-native]
    if: ${{ !cancelled() && needs.images.result == 'success' && needs.xtask-windows.result == 'success' && (needs.deps-native.result == 'success' || needs.deps-native.result == 'skipped') }}
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: rust
          cache: false
      - name: clippy component
        run: rustup component add clippy
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: sccache@0.19.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: xtask-windows
          path: bin
      - name: Environment
        run: bin/xtask.exe ci-env
      - name: Cache key
        id: key
        run: echo "key=$(bin/xtask.exe lane-key clippy-windows)" >>"$GITHUB_OUTPUT"
      - name: Dependencies (read-only lane cache)
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/sccache
          key: ${{ steps.key.outputs.key }}
      # TODO(xtask): platforms::windows() only knows cargo-xwin. With a `cfg!(windows)` branch
      # (native `cargo clippy -p trade-app --lib -- -D warnings`) this step becomes
      # `cargo xtask check platform:windows`, like macOS.
      - name: clippy (native Windows)
        run: cargo clippy -p trade-app --lib -- -D warnings
      - name: sccache stats
        if: always()
        run: sccache --show-stats | grep -E '^(Compile requests|Cache hits|Cache misses) ' || true

  clippy-macos:
    needs: [images, deps-native]
    # Paused for now: restore the condition of clippy-windows and the deps-native matrix entry.
    if: false
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: rust
          cache: false
      - name: clippy component
        run: rustup component add clippy
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: sccache@0.19.0
      - name: Environment
        run: cargo xtask ci-env
      - name: Cache key
        id: key
        run: echo "key=$(cargo xtask lane-key clippy-macos)" >>"$GITHUB_OUTPUT"
      - name: Dependencies (read-only lane cache)
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/sccache
          key: ${{ steps.key.outputs.key }}
      # xtask's macos() on a Mac host is a native clippy of trade-app.
      - name: cargo xtask check platform:macos
        run: cargo xtask check platform:macos
      - name: sccache stats
        if: always()
        run: sccache --show-stats | grep -E '^(Compile requests|Cache hits|Cache misses) ' || true
      - name: Logs of a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clippy-macos-logs
          path: .cache/xtask/
          retention-days: 7
          if-no-files-found: ignore

  # The required status check of the protected branches: green only if every lane is.
  ci-ok:
    if: always()
    needs: [images, xtask, xtask-windows, deps-node, deps, deps-native, check-linux, frontend-static, frontend-e2e, frontend-layout, check-android, clippy-windows, clippy-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: xtask-linux
          path: bin
      - name: Make xtask executable
        run: chmod +x bin/xtask
      - name: Every lane succeeded (deps are skipped on main)
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: bin/xtask ci-ok
