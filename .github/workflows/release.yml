# Bundles of every platform and a GitHub release, through `cargo xtask`.
#
#   push to development   pre-release X.Y.Z-N (dev channel: "Multi Wallet Tracker Dev")
#   push to main          release X.Y.Z (prod channel), then the back-merge PR and the AUR
#   workflow_dispatch     any branch, channel dev|prod; `publish: false` builds and publishes nothing
#
# Order (builds run alongside the checks; nothing is published until the checks are green):
#
#   version, images -> frontend (dist/ once) -> build (linux, android, windows; fail-fast)
#                   -> checks (ci.yml), in parallel with the builds
#   checks, build   -> package (pacman, flatpak)
#   checks, package -> publish (+ prune of old pre-releases) -> aur, backmerge
#   checks red      -> cancel-on-red stops the whole run
#
# What each job does and the secrets it needs: docs/ci.md, "release.yml". The release notes, the
# tag and the checksums are `cargo xtask publish`; the version is `cargo xtask version`.
name: release

on:
  push:
    branches: [development, main]
  workflow_dispatch:
    inputs:
      channel:
        description: Channel the build ships under (names, identifiers, icons)
        type: choice
        options: [dev, prod]
        default: dev
      publish:
        description: Publish a GitHub release (dev on development, prod on main only); off = build only
        type: boolean
        default: false

# One run per branch at a time. A push to development cancels the older pre-release run (the
# newer one supersedes it; runs never overlap, so the pre-release number N taken from the tags
# stays unique). A release from main and a manual run are never cancelled half way: they wait.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/development' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ------------------------------------------------------------------ version
  # The plan (channel, publish or not), the version the builds ship under and the xtask binary
  # every later job runs: only this job compiles Rust. The tag lookup needs the checkout's
  # credentials (read-only token).
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      publish: ${{ steps.plan.outputs.publish }}
      pre: ${{ steps.plan.outputs.pre }}
      version: ${{ steps.version.outputs.BUILD_VERSION }}
      version_code: ${{ steps.version.outputs.ANDROID_VERSION_CODE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Plan
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: .github/scripts/release-plan.sh
      # Rust as mise.toml pins it (no version in this file).
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: rust
          cache: false
      - name: Build xtask
        run: cargo build -p xtask --locked
      - name: Version
        id: version
        env:
          KIND: ${{ steps.plan.outputs.kind }}
        run: .rust-target/debug/xtask version --channel "$KIND" --output "$GITHUB_OUTPUT"
      # The Windows runner has no Rust of its own for this: its overlay (names, version,
      # versionCode, prebuilt dist/) is written here.
      - name: Tauri overlay for the Windows build
        env:
          CHANNEL: ${{ steps.plan.outputs.channel }}
          BUILD_VERSION: ${{ steps.version.outputs.BUILD_VERSION }}
          VERSION_CODE: ${{ steps.version.outputs.ANDROID_VERSION_CODE }}
        run: |
          .rust-target/debug/xtask tauri-config --channel "$CHANNEL" --version "$BUILD_VERSION" \
            --version-code "$VERSION_CODE" --prebuilt-frontend --out .cache/tauri-ci-windows.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xtask
          path: .rust-target/debug/xtask
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tauri-config
          path: .cache/tauri-ci-windows.json
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  # ------------------------------------------------------------------ images
  # The CI images the frontend and the builds run in (a tag already in ghcr is not built again).
  # ci.yml calls the same workflow; by then the tag exists, so it costs seconds.
  images:
    uses: ./.github/workflows/images.yml
    permissions:
      contents: read
      packages: write

  # ------------------------------------------------------------------ checks
  # ci.yml as a reusable workflow (deps, check-linux, frontend-static/-e2e/-layout, check-android,
  # clippy-windows, ci-ok): the same lanes as in a PR. Its push trigger is gone, this is the run.
  # The builds do not wait for it; `publish` does, and a red result cancels the run.
  checks:
    needs: [version, images]
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: write # images.yml
      actions: write # deps deletes the lane's older caches

  # ------------------------------------------------------------------ frontend
  # `vite build` once for every platform: dist/ goes to the builds as an artifact, and their Tauri
  # overlays have no beforeBuildCommand.
  frontend:
    needs: [version, images]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ${{ needs.images.outputs.base }}/ci-node:${{ needs.images.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    env:
      MISE_DATA_DIR: /opt/mise
      MISE_YES: "1"
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain from the image
        run: |
          echo /opt/mise/shims >>"$GITHUB_PATH"
          mise trust "$GITHUB_WORKSPACE/mise.toml"
      - name: pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/pnpm
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: pnpm install
        run: |
          pnpm config set store-dir "$GITHUB_WORKSPACE/.cache/pnpm"
          pnpm install --frozen-lockfile --prefer-offline
      - name: pnpm build
        run: pnpm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 1
          if-no-files-found: error

  # ------------------------------------------------------------------ build
  # One group: the first failure cancels the others (fail-fast). linux and android run
  # `cargo xtask build` on the runner, which starts the ci-linux / ci-android image from ghcr
  # (podman or docker, as on a developer machine); windows is the native script, WiX makes the MSI
  # there. The release profile follows the channel (xtask and build-windows.ps1 set it): dev
  # builds without LTO on 16 codegen units, prod keeps the full LTO of [profile.release].
  # Pre-releases also take compiled crates from the lane's sccache (key from `xtask lane-key
  # build-<name>`: dependencies, image, channel), saved once per key; releases from main build
  # from scratch, as in ci.yml. The builds do not wait for the checks.
  build:
    needs: [version, images, frontend]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: linux, os: ubuntu-latest }
          - { name: android, os: ubuntu-latest }
          - { name: windows, os: windows-latest }
          # macOS is the build-macos job below (paused).
    permissions:
      contents: read
      packages: read
      # `xtask deps-prune` deletes the lane's older caches.
      actions: write
    env:
      RELEASE_CHANNEL: ${{ needs.version.outputs.channel }}
      BUILD_VERSION: ${{ needs.version.outputs.version }}
      ANDROID_VERSION_CODE: ${{ needs.version.outputs.version_code }}
      CARGO_INCREMENTAL: "0"
      # linuxdeploy (AppImage) is an AppImage itself: no FUSE in containers.
      APPIMAGE_EXTRACT_AND_RUN: "1"
      NO_STRIP: "true"
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      ANDROID_TARGETS: aarch64 armv7 x86_64
      CONTAINER_ENGINE: docker
      SCCACHE_PIN: 0.19.0
      # xtask mounts ~/.cache/sccache/containers into the build image; the Windows script uses .cache\sccache.
      SCCACHE_PATH: ${{ matrix.name == 'windows' && '.cache/sccache' || '~/.cache/sccache/containers' }}
      USE_CACHE: ${{ needs.version.outputs.channel == 'dev' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      # The prebuilt xtask is a Linux binary: the Windows runner has no use for it and runs the
      # cache commands through `cargo xtask` (the runner's own Rust; build-windows.ps1 installs
      # the pinned one only later).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.name != 'windows'
        with:
          name: xtask
          path: bin
      - name: Make xtask executable
        if: matrix.name != 'windows'
        run: chmod +x bin/xtask
      - name: Cache key
        id: key
        if: env.USE_CACHE == 'true'
        shell: bash
        run: echo "key=$(${{ matrix.name == 'windows' && 'cargo xtask' || 'bin/xtask' }} lane-key 'build-${{ matrix.name }}')" >>"$GITHUB_OUTPUT"
      - name: Restore the lane cache
        id: cache
        if: env.USE_CACHE == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_PATH }}
          key: ${{ steps.key.outputs.key }}
          restore-keys: build-${{ matrix.name }}-

      # ---- linux, android
      - name: Log in to ghcr.io
        if: matrix.name != 'windows'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: Linux (deb, rpm, AppImage, tar.gz)
        if: matrix.name == 'linux'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bin/xtask build linux --prebuilt-frontend --channel "$RELEASE_CHANNEL" --version "$BUILD_VERSION"
      # The Android image is large; the signing key reaches the container as an environment
      # variable (masked here, never printed) and sign-android.sh decodes it into a temporary
      # file that disappears with the container. Without the key the build is signed with a
      # throwaway one (the files are named *-testkey): fine for a build-only run, never published.
      - name: Android (APK, AAB)
        if: matrix.name == 'android'
        env:
          PUBLISH: ${{ needs.version.outputs.publish }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [[ "$PUBLISH" == true && -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set: an APK signed with another key cannot update the installed app"
            exit 1
          fi
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          bin/xtask build android --prebuilt-frontend --channel "$RELEASE_CHANNEL" --version "$BUILD_VERSION" \
            --version-code "$ANDROID_VERSION_CODE"

      # ---- windows
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.name == 'windows'
        with:
          name: tauri-config
          path: .cache
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        if: matrix.name == 'windows' && env.USE_CACHE == 'true'
        with:
          tool: sccache@${{ env.SCCACHE_PIN }}
      - name: Windows (NSIS, MSI, portable zip)
        if: matrix.name == 'windows'
        shell: pwsh
        env:
          MWT_TAURI_CONFIG: ${{ github.workspace }}\.cache\tauri-ci-windows.json
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/ci/build-windows.ps1 -OutDir release

      # The containers write the sccache directory as root; the cache action (tar, as the runner
      # user) fails on it with "Permission denied". Hand it back, also after a failed build.
      - name: Hand the container cache back to the runner user
        if: always() && env.USE_CACHE == 'true' && matrix.name != 'windows'
        run: sudo chown -R "$(id -u):$(id -g)" "$HOME/.cache/sccache" || true
      - name: Save the lane cache
        if: env.USE_CACHE == 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_PATH }}
          key: ${{ steps.key.outputs.key }}
      - name: Delete the lane's older caches on this ref
        if: env.USE_CACHE == 'true' && steps.cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ${{ matrix.name == 'windows' && 'cargo xtask' || 'bin/xtask' }} deps-prune 'build-${{ matrix.name }}' '${{ steps.key.outputs.key }}'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ matrix.name }}
          path: ${{ matrix.name == 'windows' && 'release' || format('.cache/build-all/builds/{0}', needs.version.outputs.channel) }}
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  # macOS: a universal .dmg and the .app tarball, signed ad hoc (Apple signing is not set up:
  # add APPLE_* secrets and pass them to the build step, see build-macos.sh). Paused like clippy-macos in ci.yml; to switch it on remove `if: false` and add
  # `build-macos` to the `needs` and to the `if` of `publish` (it accepts `skipped` today), and pass
  # `macos` as the third argument of check-release-files.sh.
  build-macos:
    needs: [version, frontend]
    if: false
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      RELEASE_CHANNEL: ${{ needs.version.outputs.channel }}
      BUILD_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: rust
          cache: false
      - name: macOS (dmg, app tarball)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo xtask build macos --prebuilt-frontend --channel "$RELEASE_CHANNEL" --version "$BUILD_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-macos
          path: .cache/build-all/builds/${{ needs.version.outputs.channel }}
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  # ------------------------------------------------------------------ package
  # pacman and Flatpak start from the Linux tarball: they wait for the whole build group.
  # Both run in archlinux:base-devel under the container engine (flatpak-builder needs
  # --privileged for bubblewrap).
  package:
    needs: [version, checks, build]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: pacman, files: '*.pkg.tar.zst' }
          - { name: flatpak, files: '*.flatpak' }
    permissions:
      contents: read
    env:
      CONTAINER_ENGINE: docker
      CHANNEL: ${{ needs.version.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: xtask
          path: bin
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle-linux
          path: .cache/build-all/builds/${{ needs.version.outputs.channel }}
      - name: Package
        env:
          BUILD_VERSION: ${{ needs.version.outputs.version }}
        run: |
          chmod +x bin/xtask
          bin/xtask build "${{ matrix.name }}" --channel "$CHANNEL" --version "$BUILD_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ matrix.name }}
          path: .cache/build-all/builds/${{ needs.version.outputs.channel }}/${{ matrix.files }}
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  # ------------------------------------------------------------------ publish
  # The only job that writes to the repository: SHA256SUMS, tag, release (`cargo xtask publish`),
  # then the old pre-releases beyond PRERELEASES_KEPT (10) go (a failure there does not fail the run).
  # The updater manifest (latest.json, latest-dev.json on the dev channel) is built from the .sig files
  # next to the bundles (cargo xtask publish); the dev channel also refreshes the `updater-dev`
  # pre-release that holds latest-dev.json under a stable URL.
  publish:
    needs: [version, checks, build, build-macos, package]
    # The builds run alongside the checks, so the checks gate the release here: `checks` must be
    # a success (not skipped), as must build and package. build-macos is skipped while it is
    # paused; any other result than success or skipped stops the release.
    if: ${{ !cancelled() && needs.version.outputs.publish == 'true' && needs.checks.result == 'success' && needs.build.result == 'success' && needs.package.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.build-macos.result) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_VERSION: ${{ needs.version.outputs.version }}
      PRE: ${{ needs.version.outputs.pre }}
    steps:
      # Pre-release notes: the commits since the closest release tag in this history, grouped like
      # the CHANGELOG; a release takes its CHANGELOG section (cargo xtask publish).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: xtask
          path: bin
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundle-*
          merge-multiple: true
          path: release
      - name: Every file of the release is there
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: .github/scripts/check-release-files.sh release "$BUILD_VERSION"
      - name: Release
        run: |
          chmod +x bin/xtask
          flags=()
          if [[ "$PRE" == true ]]; then flags+=(--pre); fi
          bin/xtask publish --version "$BUILD_VERSION" --dir release "${flags[@]}"
      - name: Old pre-releases
        if: needs.version.outputs.pre == 'true'
        continue-on-error: true
        run: bin/xtask prune-prereleases

  # ------------------------------------------------------------------ cancel-on-red
  # The builds are not gated by the checks; when a check fails there is nothing to publish, so the
  # rest of the run (builds, packaging) is stopped instead of burning an hour of runners.
  cancel-on-red:
    needs: checks
    if: ${{ !cancelled() && needs.checks.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Cancel this run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run cancel "$RUN_ID"

  # ------------------------------------------------------------------ aur
  # multi-wallet-tracker-bin for Arch, from the published tarball. No AUR_SSH_PRIVATE_KEY: skipped
  # with a warning.
  aur:
    needs: [version, publish]
    if: ${{ needs.version.outputs.channel == 'prod' && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: docker.io/library/archlinux:base-devel
    permissions:
      contents: read
    env:
      BUILD_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Key
        id: key
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [[ -z "$AUR_SSH_PRIVATE_KEY" ]]; then
            echo "::warning::AUR_SSH_PRIVATE_KEY is not set: multi-wallet-tracker-bin is not pushed to the AUR"
            echo "present=false" >>"$GITHUB_OUTPUT"
          else
            echo "present=true" >>"$GITHUB_OUTPUT"
          fi
      - name: git
        if: steps.key.outputs.present == 'true'
        run: pacman -Sy --noconfirm --needed git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.present == 'true'
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.key.outputs.present == 'true'
        with:
          name: xtask
          path: bin
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.key.outputs.present == 'true'
        with:
          name: bundle-linux
          path: release
      - name: Push to the AUR
        if: steps.key.outputs.present == 'true'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          chmod +x bin/xtask
          bin/xtask publish-aur --version "$BUILD_VERSION" --dir release

  # ------------------------------------------------------------------ backmerge
  # The PR main -> development after a release, from GITHUB_TOKEN: needs Settings -> Actions ->
  # "Allow GitHub Actions to create and approve pull requests", and its checks do not start by
  # themselves. A failure is only a message: the PR can be opened by hand.
  backmerge:
    needs: [version, publish]
    if: ${{ needs.version.outputs.channel == 'prod' && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: xtask
          path: bin
      - name: Open the PR
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_VERSION: ${{ needs.version.outputs.version }}
        run: |
          chmod +x bin/xtask
          bin/xtask backmerge --version "$BUILD_VERSION"
