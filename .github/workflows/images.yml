# The CI images (scripts/ci/ci.Dockerfile: ci-node, ci-linux, ci-android) in ghcr.io.
# The tag is `xtask image-tag` (a hash of the Dockerfile, apt-packages.sh,
# install-chrome.sh and the [tools] of mise.toml); a target that is already in
# the registry is not built again, so a run with unchanged inputs costs seconds.
#
# ci.yml calls this workflow first on every run, so a change to those files is
# built before the jobs that need it (one workflow, no race between two runs).
# By hand: Actions -> images -> Run workflow ("force" rebuilds the current tag).
name: images

on:
  workflow_call:
    outputs:
      tag:
        description: Image tag (xtask image-tag)
        value: ${{ jobs.images.outputs.tag }}
      base:
        description: Registry path without the target, e.g. ghcr.io/reckeck/mwt
        value: ${{ jobs.images.outputs.base }}
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and push even if the tag exists
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.build.outputs.tag }}
      base: ${{ steps.build.outputs.base }}
    # No concurrency group: GitHub keeps one pending run per group and cancels the
    # older pending one, so a burst of PRs (Dependabot) lost its images job and
    # with it every check. A run with an unchanged tag ends after the registry
    # probe; two runs building a new tag at once push the same image, which is harmless.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Rust as mise.toml pins it (no version in this file); xtask is built here on the runner
      # (no container: docker needs the host), its dependencies come from the Actions cache.
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: rust
          cache: false
      - name: Compiled xtask dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/xtask-target
          key: xtask-images-${{ hashFiles('Cargo.lock', 'crates/xtask/**', 'mise.toml', '.cargo/config.toml') }}
      - name: Build xtask
        run: cargo build -p xtask --locked --target-dir .cache/xtask-target
      - name: Log in to ghcr.io
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: Build and push what is missing
        id: build
        env:
          FORCE: ${{ inputs.force && '1' || '' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: .cache/xtask-target/debug/xtask ci-images
