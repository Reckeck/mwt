# Mirrors development, main and the tags to GitLab (Reckeck/trade-app), which has
# no CI of its own; the logic is scripts/ci/mirror-gitlab.sh (docs/ci.md, "Workflows").
name: mirror

on:
  push:
    branches: [development, main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: mirror
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gitlab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Push to GitLab
        env:
          GITLAB_MIRROR_KEY: ${{ secrets.GITLAB_MIRROR_KEY }}
        run: scripts/ci/mirror-gitlab.sh
