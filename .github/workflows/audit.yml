# Dependency advisories (RustSec for Cargo.lock, npm for pnpm-lock.yaml): cargo xtask audit.
# Separate from ci.yml and not part of ci-ok: a new advisory in an untouched dependency
# must not block unrelated PRs, so it also runs daily. Accepted advisories, each with a
# reason, live in audit-ignore.toml (docs/ci.md, "Dependency audit").
name: audit

on:
  pull_request:
    branches: [development, main, "feat/**"]
  push:
    branches: [development, main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # node, pnpm and rust as mise.toml pins them (no versions in this file).
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          cache: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit@0.22.2
      # pnpm audit reads pnpm-lock.yaml only: no install needed.
      - name: Audit
        run: cargo xtask audit
