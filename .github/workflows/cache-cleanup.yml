# Caches belong to a ref, and 10 GB is the whole repository's quota: when a
# branch is deleted or a PR closed, delete every cache of that ref
# (refs/heads/<branch>, refs/pull/<N>/merge and refs/pull/<N>/head).
# "Automatically delete head branches" (Settings -> General) makes the delete
# event fire after a merge.
# Docs: https://docs.github.com/en/actions/using-workflows/caching-dependencies-to-speed-up-workflows#managing-caches
name: cache-cleanup

on:
  delete:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  cleanup:
    # `delete` also fires for tags.
    if: github.event_name == 'pull_request' || github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Rust as mise.toml pins it (no version in this file); xtask is compiled here, no artifact to take.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: rust
          cache: false
      - name: Delete the caches of the ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.event.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: cargo xtask cache-cleanup
