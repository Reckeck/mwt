# Project-local toolchain & tasks (mise). See AGENTS.md -> "Команды".
# Usage: mise install && mise run dev

[tools]
node = "26.8.1"
pnpm = "10"
rust = "1.98.1"

[env]
RUST_LOG = "info"

[tasks]
"setup" = "mise dependencies"
"dependencies" = { description = "Install all deps (pnpm + cargo)", run = "pnpm install && cargo fetch" }
"dev" = { description = "Run Tauri dev (frontend + core)", run = "pnpm tauri dev" }
"dev:ui" = { description = "Run Vite frontend standalone", run = "pnpm dev" }
"test" = { description = "Rust workspace tests", run = "cargo test --workspace" }
"typecheck" = { description = "Vue TS strict typecheck", run = "pnpm exec vue-tsc --noEmit" }
"lint" = { description = "Biome lint + format check (frontend)", run = "pnpm exec biome check ." }
"format" = { description = "Biome autofix (lint + format)", run = "pnpm exec biome check --write ." }
"clippy" = { description = "Clippy lints (deny warnings)", run = "cargo clippy --workspace --all-targets -- -D warnings" }
"gen-types" = { description = "Regenerate ipc.gen.d.ts from Rust (ts-rs)", run = "cargo run -p trade-core --bin gen-types" }
"test-frontend" = { description = "Frontend unit tests (vitest, project unit: happy-dom, ipc and i18n mocked in src/test/setup.ts)", run = "pnpm exec vitest run --project unit" }
"test-e2e" = { description = "End-to-end tests (vitest, project e2e): the app on the mock in headless Chromium; screenshots of failures in .cache/e2e/", run = "pnpm exec vitest run --project e2e" }
"check-onboarding" = { description = "Every screen has a tour; tour, whats-new and learning texts exist (AGENTS.md rule 12)", run = "node scripts/run-check.mjs onboarding" }
"check-routes" = { description = "Route names the backend links to exist in the UI router", run = "node scripts/run-check.mjs routes" }
"check-forms" = { description = "Forms: save buttons stay enabled, fields are checked on save (rule 13); accounts, assets, currencies use the ready pickers (rule 14)", run = "node scripts/run-check.mjs forms" }
"check-ui" = { description = "UI: shared components over raw markup, tokens over raw colours, every action reports its outcome, files split by meaning, nothing moves by itself (rule 17)", run = "node scripts/run-check.mjs ui" }
"check-layout" = { description = "Runs the app (mock) in headless Chromium: no overflow, no shift on hover/load, dialogs open in place, no listener leaks, Back closes layers, touch targets (rule 17); --quick = 1280 and 390; --jobs N processes, --shard K/N a share of the units, --update-weights rewrites tests/e2e/layout/weights.json", run = "node scripts/run-browser-check.mjs layout" }
"check-links" = { description = "Runs the app (mock) in headless Chromium: every entity mention opens its card or page and Back returns, glances open with a way out, internal links resolve; new errors past scripts/check-links.baseline.json fail; --quick = 1280 only; --update rewrites the baseline; --jobs N, --shard K/N, --update-weights as in check-layout", run = "node scripts/run-browser-check.mjs links" }
"check-fsd" = { description = "FSD boundaries (Steiger, steiger.config.ts): no new problems past scripts/check-fsd.baseline.json; --update shrinks it", run = "node scripts/run-check.mjs fsd" }
"shots" = { description = "Screenshots of a set (scripts/shots/sets.mjs) on the mock scenarios, desktop and phone, both themes, with canvas pairs; not a gate: mise run shots -- <set>", run = "node scripts/shots.mjs" }
"check" = { description = "The gate, in parallel with fail-fast (cargo xtask): biome, vue-tsc, vitest unit + checks (onboarding/routes/forms/ui/fsd), CI scripts, fmt, clippy, tests, gen-types, platforms, then e2e + layout + links (quick); logs in .cache/xtask/; --list shows the graph, task names filter", run = "cargo xtask check" }
"check-platforms" = { description = "Compile check (clippy) for linux, windows, android, macos: run after the last edit, before landing or a commit; SKIP = this machine cannot check it; mise run check-platforms -- windows", run = "cargo xtask check-platforms" }
"check-ci" = { description = "CI scripts: ASCII-only PowerShell, shell scripts parse", run = "scripts/ci/lint-ci.sh" }
"audit" = { description = "Dependency advisories: cargo-audit + pnpm audit minus the reasoned exceptions of audit-ignore.toml (not part of check; CI: audit.yml); needs cargo install cargo-audit --locked --version 0.22.2", run = "cargo xtask audit" }
"changelog" = { description = "CHANGELOG.md: refresh the [Unreleased] commit list from the commits (git-cliff)", run = "cargo xtask changelog" }
"bump" = { description = "Next version (auto|patch|minor|major|X.Y.Z) in every file + CHANGELOG section", run = "cargo xtask bump" }
"icons" = { description = "App icons of both channels from crates/app/icons/src (SVG) into crates/app/icons/{prod,dev} and public/favicon.svg; needs rsvg-convert + magick", run = "scripts/icons.sh" }
"ci-image-tag" = { description = "CI image tag (hash of the image inputs; images.yml builds under it)", run = "cargo xtask image-tag" }
"build" = { description = "Full release bundle (deb/rpm/AppImage)", run = "cargo test --workspace && pnpm exec vue-tsc --noEmit && pnpm tauri build" }
"build:all" = { description = "Bundles for every platform (linux pacman flatpak android windows macos) in the CI images, one frontend build, platforms in parallel, into .cache/build-all/builds/<channel>/ (cargo xtask build: --channel dev|prod, --heavy N, --native, platform...)", run = "cargo xtask build" }