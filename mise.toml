# Project-local toolchain & tasks (mise). See AGENTS.md -> "Команды".
# Usage: mise install && mise run dev

[tools]
node = "26.8.1"
pnpm = "10"
rust = "1.98.1"

[env]
RUST_LOG = "info"
CARGO_TARGET_DIR = ".rust-target"

[tasks]
"setup" = "mise dependencies"
"dependencies" = { description = "Install all deps (pnpm + cargo)", run = "pnpm install && cargo fetch" }
"dev" = { description = "Run Tauri dev (frontend + core)", run = "pnpm tauri dev" }
"dev:ui" = { description = "Run Vite frontend standalone", run = "pnpm dev" }
"test" = { description = "Rust workspace tests", run = "cargo test --workspace" }
"typecheck" = { description = "Vue TS strict typecheck", run = "pnpm exec vue-tsc --noEmit" }
"lint" = { description = "Biome lint + format check (frontend)", run = "pnpm exec biome check ." }
"format" = { description = "Biome autofix (lint + format)", run = "pnpm exec biome check --write ." }
"clippy" = { description = "Clippy lints (deny warnings)", run = "cargo clippy --workspace --all-targets -- -D warnings" }
"gen-types" = { description = "Regenerate ipc.gen.d.ts from Rust (ts-rs)", run = "cargo run -p trade-core --bin gen-types" }
"check-onboarding" = { description = "Every screen has a tour; tour, whats-new and learning texts exist (AGENTS.md rule 12)", run = "node scripts/check-onboarding.mjs" }
"check-forms" = { description = "Forms: save buttons stay enabled, fields are checked on save (AGENTS.md rule 13)", run = "node scripts/check-forms.mjs" }
"check" = { description = "Lint + typecheck + onboarding + forms + clippy + tests", run = "pnpm exec biome check . && pnpm exec vue-tsc --noEmit && node scripts/check-onboarding.mjs && node scripts/check-forms.mjs && cargo clippy --workspace --all-targets -- -D warnings && cargo test --workspace" }
"ci-image-tag" = { description = "CI image tag for .gitlab-ci.yml CI_IMAGE_TAG (hash of the image inputs)", run = "scripts/ci/image-tag.sh" }
"build" = { description = "Full release bundle (deb/rpm/AppImage)", run = "cargo test --workspace && pnpm exec vue-tsc --noEmit && pnpm tauri build" }