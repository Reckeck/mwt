# Multi Wallet Tracker (MWT) CI/CD. Описание пайплайна, переменных и выпуска — docs/ci.md.
#
#   check    lint/typecheck/onboarding/forms, fmt/clippy/tests/ipc types, SAST, secrets
#   build    Linux (deb, rpm, AppImage, tar.gz), Windows (NSIS .exe, MSI, zip),
#            Android (APK, AAB)
#   package  Flatpak and pacman (.pkg.tar.zst) from the Linux build
#   release  tag vX.Y.Z → Package Registry + GitLab Release; AUR push (manual)
#
# SAST customization: https://docs.gitlab.com/user/application_security/sast/#available-cicd-variables
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # A branch with an open MR runs as the MR pipeline only.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - check
  - build
  - package
  - release

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  SECRET_DETECTION_ENABLED: "true"
  LINUX_IMAGE: ubuntu:22.04 # oldest glibc we support: AppImage/tarball run on newer distros
  ARCH_IMAGE: archlinux:base-devel
  FLATPAK_IMAGE: archlinux:base-devel # flatpak-builder from pacman; runtime from Flathub
  WINDOWS_RUNNER_TAG: saas-windows-medium-amd64
  ANDROID_TARGETS: aarch64 armv7 x86_64
  CARGO_TARGET_DIR: $CI_PROJECT_DIR/.rust-target # absolute: tauri runs cargo from crates/app
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # linuxdeploy (AppImage) is itself an AppImage: no FUSE in containers.
  APPIMAGE_EXTRACT_AND_RUN: "1"
  NO_STRIP: "true"
  GRADLE_USER_HOME: $CI_PROJECT_DIR/.cache/gradle
  GRADLE_OPTS: -Dorg.gradle.daemon=false

sast:
  stage: check

secret_detection:
  stage: check

# ---------------------------------------------------------------- templates

.linux:
  image: $LINUX_IMAGE
  before_script:
    - source scripts/ci/setup-linux.sh
  cache:
    - &toolchain-cache
      key:
        prefix: toolchain
        files: [mise.toml, Cargo.lock]
      paths: [.cache/mise, .cache/rustup, .cache/cargo/bin, .cache/cargo/registry, .cache/cargo/git]
    - &pnpm-cache
      key:
        prefix: pnpm
        files: [pnpm-lock.yaml]
      paths: [.cache/pnpm]

# Release builds: always for tags, main and manual/scheduled runs; on demand in MRs.
.build-rules:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true

.build-needs:
  needs:
    - job: frontend:check
    - job: rust:check
    - job: version:check
      optional: true

# ------------------------------------------------------------------- check

frontend:check:
  extends: .linux
  stage: check
  variables:
    CI_SKIP_GUI_LIBS: "1"
    CI_MISE_TOOLS: node pnpm
  script:
    - mise run lint
    - mise run typecheck
    - mise run check-onboarding
    - mise run check-forms

rust:check:
  extends: .linux
  stage: check
  variables:
    CI_MISE_TOOLS: rust
  script:
    - rustup component add rustfmt clippy
    - mkdir -p dist # frontendDist for tauri::generate_context!; the UI is not built here
    - cargo fmt --all -- --check
    - mise run clippy
    - mise run test
    # ipc.gen.d.ts is generated from Rust and must be committed up to date.
    - mise run gen-types
    - git diff --exit-code -- src/shared/api/ipc.gen.d.ts
  cache:
    - *toolchain-cache
    - key: target-check-$CI_COMMIT_REF_SLUG
      fallback_keys: [target-check-$CI_DEFAULT_BRANCH]
      paths: [.rust-target/debug/deps, .rust-target/debug/build, .rust-target/debug/.fingerprint]

version:check:
  image: $LINUX_IMAGE
  stage: check
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - scripts/ci/version.sh

# ------------------------------------------------------------------- build

build:linux:
  extends: [.linux, .build-rules, .build-needs]
  stage: build
  script:
    - VERSION="$(scripts/ci/version.sh)"
    - pnpm tauri build --ci --bundles deb,rpm,appimage
    - scripts/ci/collect-linux.sh "$VERSION" release
  artifacts:
    name: multi-wallet-tracker-linux
    paths: [release/]
    expire_in: 2 weeks

build:windows:
  extends: [.build-rules, .build-needs]
  stage: build
  tags: [$WINDOWS_RUNNER_TAG]
  timeout: 2h
  script:
    - ./scripts/ci/build-windows.ps1 -OutDir release
  cache:
    key:
      prefix: windows-toolchain
      files: [mise.toml, Cargo.lock]
    paths: [.cache/cargo/bin, .cache/cargo/registry, .cache/rustup, .cache/node-*, .cache/pnpm]
  artifacts:
    name: multi-wallet-tracker-windows
    paths: [release/]
    expire_in: 2 weeks

build:android:
  extends: [.linux, .build-rules, .build-needs]
  stage: build
  timeout: 3h
  variables:
    CI_SKIP_GUI_LIBS: "1"
  before_script:
    - source scripts/ci/setup-linux.sh
    - source scripts/ci/setup-android.sh
  script:
    - VERSION="$(scripts/ci/version.sh)"
    # The Gradle project is generated, not committed (crates/app/gen/android).
    - pnpm tauri android init --ci
    - pnpm tauri icon crates/app/icons/icon.png
    - pnpm tauri android build --ci --apk --aab --target $ANDROID_TARGETS
    - scripts/ci/sign-android.sh "$VERSION" release
  cache:
    - *toolchain-cache
    - *pnpm-cache
    - key: gradle
      paths: [.cache/gradle/caches, .cache/gradle/wrapper]
  artifacts:
    name: multi-wallet-tracker-android
    paths: [release/]
    expire_in: 2 weeks

# ----------------------------------------------------------------- package

# flatpak-builder needs bubblewrap: the runner must be privileged (GitLab.com
# shared runners are).
package:flatpak:
  extends: .build-rules
  stage: package
  image: $FLATPAK_IMAGE
  needs: [build:linux]
  cache:
    key: flatpak-gnome
    paths: [.flatpak-builder/downloads]
  before_script:
    - pacman -Sy --noconfirm --needed flatpak flatpak-builder git >/dev/null
  script:
    - VERSION="$(scripts/ci/version.sh)"
    - git clone --depth 1 https://github.com/flathub/shared-modules.git packaging/flatpak/shared-modules
    - cp "release/multi-wallet-tracker-$VERSION-linux-x86_64.tar.gz" packaging/flatpak/multi-wallet-tracker-linux-x86_64.tar.gz
    - flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
    - flatpak-builder --user --disable-rofiles-fuse --install-deps-from=flathub --force-clean
      --repo=.flatpak-repo .flatpak-build packaging/flatpak/dev.mwt.MultiWalletTracker.yml
    - flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
      .flatpak-repo "release/multi-wallet-tracker-$VERSION-x86_64.flatpak" dev.mwt.MultiWalletTracker
  artifacts:
    name: multi-wallet-tracker-flatpak
    paths: [release/*.flatpak]
    expire_in: 2 weeks

package:pacman:
  extends: .build-rules
  stage: package
  image: $ARCH_IMAGE
  needs: [build:linux]
  script:
    - VERSION="$(scripts/ci/version.sh)"
    - scripts/ci/build-pacman.sh "$VERSION" release
  artifacts:
    name: multi-wallet-tracker-pacman
    paths: [release/*.pkg.tar.zst]
    expire_in: 2 weeks

# ----------------------------------------------------------------- release

release:
  stage: release
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_TAG
  needs: [build:linux, build:windows, build:android, package:flatpak, package:pacman]
  before_script:
    - apk add --no-cache bash curl jq coreutils sed
  script:
    - VERSION="$(scripts/ci/version.sh)"
    - scripts/ci/release.sh "$VERSION" release

aur:publish:
  stage: release
  image: $ARCH_IMAGE
  rules:
    - if: $CI_COMMIT_TAG && $AUR_SSH_PRIVATE_KEY
      when: manual
  needs: [build:linux, release]
  script:
    - VERSION="$(scripts/ci/version.sh)"
    - scripts/ci/publish-aur.sh "$VERSION" release
