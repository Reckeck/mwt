# Multi Wallet Tracker (MWT) CI/CD. Описание пайплайна, переменных и выпуска — docs/ci.md.
#
#   .pre     ci:image — the CI images, only when their inputs change
#   check    frontend, rust:fmt / rust:clippy / rust:test (parallel), SAST, secrets
#   build    Linux (deb, rpm, AppImage, tar.gz), Windows (NSIS .exe, MSI, zip),
#            Android (APK, AAB) — start at once, beside the checks
#   package  Flatpak and pacman (.pkg.tar.zst) from the Linux build
#   release  tag vX.Y.Z, all checks and builds green → Package Registry +
#            GitLab Release; AUR push (manual)
#
# Speed: jobs run in prebuilt images (scripts/ci/ci.Dockerfile), compiled
# crates come back through sccache, MR pipelines skip what their changes do
# not touch, and a new push cancels the pipeline it replaces.
#
# SAST customization: https://docs.gitlab.com/user/application_security/sast/#available-cicd-variables
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    # Caches are written by main only; branches and MRs read them.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables: { CACHE_POLICY: pull }
    # A branch with an open MR runs as the MR pipeline only.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables: { CACHE_POLICY: pull-push }
    - if: $CI_COMMIT_BRANCH
      variables: { CACHE_POLICY: pull }
    - if: $CI_COMMIT_TAG
      variables: { CACHE_POLICY: pull }

stages:
  - check
  - build
  - package
  - release

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  SECRET_DETECTION_ENABLED: "true"
  # = scripts/ci/image-tag.sh; ci:image refuses to build when they differ.
  CI_IMAGE_TAG: "2d8c301fe3bf"
  # Override any of these with ubuntu:22.04 to run without the CI images
  # (setup-linux.sh then installs everything itself).
  CI_NODE_IMAGE: $CI_REGISTRY_IMAGE/ci-node:$CI_IMAGE_TAG
  CI_LINUX_IMAGE: $CI_REGISTRY_IMAGE/ci-linux:$CI_IMAGE_TAG
  CI_ANDROID_IMAGE: $CI_REGISTRY_IMAGE/ci-android:$CI_IMAGE_TAG
  ARCH_IMAGE: archlinux:base-devel
  WINDOWS_RUNNER_TAG: saas-windows-medium-amd64
  CARGO_TARGET_DIR: $CI_PROJECT_DIR/.rust-target # absolute: tauri runs cargo from crates/app
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Debug info is not needed to check or test; smaller objects, faster links.
  CARGO_PROFILE_DEV_DEBUG: "0"
  # linuxdeploy (AppImage) is itself an AppImage: no FUSE in containers.
  APPIMAGE_EXTRACT_AND_RUN: "1"
  NO_STRIP: "true"
  GRADLE_USER_HOME: $CI_PROJECT_DIR/.cache/gradle
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  # Faster cache/artifact transfer.
  FF_USE_FASTZIP: "true"
  ARTIFACT_COMPRESSION_LEVEL: fast
  CACHE_COMPRESSION_LEVEL: fast
  CACHE_POLICY: pull-push

default:
  interruptible: true

sast:
  stage: check

secret_detection:
  stage: check

# ---------------------------------------------------------------- templates

.always-full: &always-full
  # Tags, main, manual and scheduled pipelines run everything.
  if: $CI_COMMIT_TAG || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "schedule"


.rust-rules:
  rules:
    - *always-full
    - changes:
        paths: [crates/**/*, Cargo.toml, Cargo.lock, clippy.toml, src/shared/api/ipc.gen.d.ts, .gitlab-ci.yml, scripts/ci/**/*, mise.toml]
        compare_to: refs/heads/main

.frontend-rules:
  rules:
    - *always-full
    - changes:
        paths: [src/**/*, index.html, package.json, pnpm-lock.yaml, "*.ts", "*.json", scripts/*.mjs, .gitlab-ci.yml, scripts/ci/**/*, mise.toml]
        compare_to: refs/heads/main

# Release builds: always for tags, main and manual/scheduled runs; on demand in MRs.
.build-rules:
  rules:
    - *always-full
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true

# A job waits for the image only when this pipeline rebuilds it.
.image-needs: &image-needs
  job: ci:image
  optional: true

.node:
  image: $CI_NODE_IMAGE
  needs: [*image-needs]
  variables:
    CI_SKIP_GUI_LIBS: "1"
    CI_MISE_TOOLS: node pnpm
  before_script:
    - source scripts/ci/setup-linux.sh
  cache:
    - &pnpm-cache
      key: { prefix: pnpm, files: [pnpm-lock.yaml] }
      paths: [.cache/pnpm]
      policy: $CACHE_POLICY

.rust:
  image: $CI_LINUX_IMAGE
  needs: [*image-needs]
  variables:
    CI_MISE_TOOLS: rust
  before_script:
    - source scripts/ci/setup-linux.sh
    - mkdir -p dist # frontendDist for tauri::generate_context!; the UI is not built here
  after_script:
    - sccache --show-stats || true

.cargo-cache: &cargo-cache
  key: { prefix: cargo, files: [Cargo.lock] }
  paths: [.cache/cargo-registry]
  policy: $CACHE_POLICY

# ------------------------------------------------------------------- image

ci:image:
  stage: .pre
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: /certs
  rules:
    - changes: [scripts/ci/ci.Dockerfile, scripts/ci/apt-packages.sh, scripts/ci/image-tag.sh, scripts/ci/build-images.sh, mise.toml, .dockerignore]
    - if: $FORCE_CI_IMAGE
  before_script:
    - apk add --no-cache bash coreutils
  script:
    - scripts/ci/build-images.sh

# ------------------------------------------------------------------- check

frontend:check:
  extends: [.node, .frontend-rules]
  stage: check
  script:
    - mise run lint
    - mise run typecheck
    - mise run check-onboarding
    - mise run check-forms

rust:fmt:
  extends: [.rust, .rust-rules]
  stage: check
  before_script:
    - source scripts/ci/setup-linux.sh
  script:
    - cargo fmt --all -- --check
  after_script: []

rust:clippy:
  extends: [.rust, .rust-rules]
  stage: check
  script:
    - mise run clippy
  cache:
    - *cargo-cache
    - key: sccache-clippy-$CI_IMAGE_TAG
      paths: [.cache/sccache]
      policy: $CACHE_POLICY

rust:test:
  extends: [.rust, .rust-rules]
  stage: check
  script:
    - mise run test
    # ipc.gen.d.ts is generated from Rust and must be committed up to date.
    - mise run gen-types
    - git diff --exit-code -- src/shared/api/ipc.gen.d.ts
  cache:
    - *cargo-cache
    - key: sccache-test-$CI_IMAGE_TAG
      paths: [.cache/sccache]
      policy: $CACHE_POLICY

version:check:
  image: $CI_NODE_IMAGE
  stage: check
  needs: [*image-needs]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - scripts/ci/version.sh

# ------------------------------------------------------------------- build

.build-needs:
  needs:
    - *image-needs
    - job: version:check
      optional: true

build:linux:
  extends: [.rust, .build-rules, .build-needs]
  stage: build
  variables:
    CI_MISE_TOOLS: "" # node, pnpm and rust
  script:
    - VERSION="$(scripts/ci/version.sh)"
    - pnpm tauri build --ci --bundles deb,rpm,appimage
    - scripts/ci/collect-linux.sh "$VERSION" release
  cache:
    - *cargo-cache
    - *pnpm-cache
    - key: sccache-linux-release-$CI_IMAGE_TAG
      paths: [.cache/sccache]
      policy: $CACHE_POLICY
  artifacts:
    name: multi-wallet-tracker-linux
    paths: [release/]
    expire_in: 2 weeks

build:windows:
  extends: [.build-rules]
  stage: build
  needs:
    - job: version:check
      optional: true
  tags: [$WINDOWS_RUNNER_TAG]
  timeout: 2h
  script:
    - ./scripts/ci/build-windows.ps1 -OutDir release
  cache:
    - key: { prefix: windows-toolchain, files: [mise.toml] }
      paths: [.cache/rustup, .cache/cargo/bin, .cache/node-*, .cache/sccache-*.exe]
      policy: $CACHE_POLICY
    - key: { prefix: windows-deps, files: [Cargo.lock, pnpm-lock.yaml] }
      paths: [.cache/cargo/registry, .cache/pnpm]
      policy: $CACHE_POLICY
    - key: sccache-windows
      paths: [.cache/sccache]
      policy: $CACHE_POLICY
  artifacts:
    name: multi-wallet-tracker-windows
    paths: [release/]
    expire_in: 2 weeks

build:android:
  extends: [.rust, .build-rules, .build-needs]
  image: $CI_ANDROID_IMAGE
  stage: build
  timeout: 2h
  variables:
    CI_SKIP_GUI_LIBS: "1"
    CI_MISE_TOOLS: "" # node, pnpm and rust
    # Every ABI for a release; phones only (arm64) otherwise.
    ANDROID_TARGETS: aarch64
  rules:
    - if: $CI_COMMIT_TAG
      variables: { ANDROID_TARGETS: aarch64 armv7 x86_64 }
    - !reference [.build-rules, rules]
  before_script:
    - source scripts/ci/setup-linux.sh
    - source scripts/ci/setup-android.sh
  script:
    - VERSION="$(scripts/ci/version.sh)"
    # The Gradle project is generated, not committed (crates/app/gen/android).
    - pnpm tauri android init --ci
    - pnpm tauri icon crates/app/icons/icon.png
    - pnpm tauri android build --ci --apk --aab --target $ANDROID_TARGETS
    - scripts/ci/sign-android.sh "$VERSION" release
  cache:
    - *cargo-cache
    - *pnpm-cache
    - key: sccache-android-$CI_IMAGE_TAG
      paths: [.cache/sccache]
      policy: $CACHE_POLICY
    - key: gradle
      paths: [.cache/gradle/caches, .cache/gradle/wrapper]
      policy: $CACHE_POLICY
  artifacts:
    name: multi-wallet-tracker-android
    paths: [release/]
    expire_in: 2 weeks

# ----------------------------------------------------------------- package

# flatpak-builder needs bubblewrap: the runner must be privileged (GitLab.com
# shared runners are).
package:flatpak:
  extends: .build-rules
  stage: package
  image: $ARCH_IMAGE
  needs: [build:linux]
  cache:
    key: flatpak-gnome
    paths: [.flatpak-builder/downloads]
    policy: $CACHE_POLICY
  before_script:
    - pacman -Sy --noconfirm --needed flatpak flatpak-builder git >/dev/null
  script:
    - VERSION="$(scripts/ci/version.sh)"
    - git clone --depth 1 https://github.com/flathub/shared-modules.git packaging/flatpak/shared-modules
    - cp "release/multi-wallet-tracker-$VERSION-linux-x86_64.tar.gz" packaging/flatpak/multi-wallet-tracker-linux-x86_64.tar.gz
    - flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
    - flatpak-builder --user --disable-rofiles-fuse --install-deps-from=flathub --force-clean
      --repo=.flatpak-repo .flatpak-build packaging/flatpak/dev.mwt.MultiWalletTracker.yml
    - flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
      .flatpak-repo "release/multi-wallet-tracker-$VERSION-x86_64.flatpak" dev.mwt.MultiWalletTracker
  artifacts:
    name: multi-wallet-tracker-flatpak
    paths: [release/*.flatpak]
    expire_in: 2 weeks

package:pacman:
  extends: .build-rules
  stage: package
  image: $ARCH_IMAGE
  needs: [build:linux]
  script:
    - VERSION="$(scripts/ci/version.sh)"
    - scripts/ci/build-pacman.sh "$VERSION" release
  artifacts:
    name: multi-wallet-tracker-pacman
    paths: [release/*.pkg.tar.zst]
    expire_in: 2 weeks

# ----------------------------------------------------------------- release

# Builds no longer wait for the checks, so the release does: nothing ships
# with a red check.
release:
  stage: release
  image: alpine:3.20
  interruptible: false
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - frontend:check
    - rust:fmt
    - rust:clippy
    - rust:test
    - version:check
    - build:linux
    - build:windows
    - build:android
    - package:flatpak
    - package:pacman
  before_script:
    - apk add --no-cache bash curl jq coreutils sed
  script:
    - VERSION="$(scripts/ci/version.sh)"
    - scripts/ci/release.sh "$VERSION" release

aur:publish:
  stage: release
  image: $ARCH_IMAGE
  interruptible: false
  rules:
    - if: $CI_COMMIT_TAG && $AUR_SSH_PRIVATE_KEY
      when: manual
  needs: [build:linux, release]
  script:
    - VERSION="$(scripts/ci/version.sh)"
    - scripts/ci/publish-aur.sh "$VERSION" release
