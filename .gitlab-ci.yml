# Multi Wallet Tracker (MWT) CI/CD. Как работать с ветками — docs/workflow.md,
# устройство пайплайна и переменные — docs/ci.md.
#
#   feature/*, hotfix/*, MRs   checks only (and only those the changes touch)
#   development                checks → builds (X.Y.Z-<pipeline>) → pre-release
#   main                       checks → builds (X.Y.Z) → release → AUR (manual),
#                              back-merge MR main → development
#   tags                       no pipeline: the release jobs create them
#
#   .pre     ci:image — the CI images, only when their inputs change
#   check    frontend, rust:fmt / rust:clippy / rust:test, ci:lint, version, SAST, secrets
#   build    Linux (deb, rpm, AppImage, tar.gz), Windows (NSIS .exe, MSI, zip),
#            Android (APK, AAB) — only after every check passed
#   package  Flatpak and pacman (.pkg.tar.zst) from the Linux build
#   release  pre-release / release in the Package Registry + GitLab Releases
#
# SAST customization: https://docs.gitlab.com/user/application_security/sast/#available-cicd-variables
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/

variables:
  DEV_BRANCH: development
  PROD_BRANCH: main
  PRERELEASES_KEPT: "10"
  SECRET_DETECTION_ENABLED: "true"
  # = scripts/ci/image-tag.sh; ci:image refuses to build when they differ.
  CI_IMAGE_TAG: "2d8c301fe3bf"
  # Override any of these with ubuntu:22.04 to run without the CI images
  # (setup-linux.sh then installs everything itself).
  CI_NODE_IMAGE: $CI_REGISTRY_IMAGE/ci-node:$CI_IMAGE_TAG
  CI_LINUX_IMAGE: $CI_REGISTRY_IMAGE/ci-linux:$CI_IMAGE_TAG
  CI_ANDROID_IMAGE: $CI_REGISTRY_IMAGE/ci-android:$CI_IMAGE_TAG
  ARCH_IMAGE: archlinux:base-devel
  WINDOWS_RUNNER_TAG: saas-windows-medium-amd64
  # macOS runners exist on GitLab Premium/Ultimate only: build:macos runs when
  # MACOS_BUILD is "true" (a CI/CD variable), or the pipeline would wait for
  # a runner forever.
  MACOS_BUILD: "false"
  MACOS_RUNNER_TAG: saas-macos-medium-m1
  MACOS_IMAGE: macos-15-xcode-16
  # Rust compiles and builds: 4 vCPU instead of the default small runner (2).
  # saas-linux-large-amd64 (8 vCPU) is faster still, saas-linux-small-amd64
  # cheapest.
  CI_HEAVY_RUNNER_TAG: saas-linux-medium-amd64
  ANDROID_TARGETS: aarch64 armv7 x86_64
  CARGO_TARGET_DIR: $CI_PROJECT_DIR/.rust-target # absolute: tauri runs cargo from crates/app
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Debug info is not needed to check or test; smaller objects, faster links.
  CARGO_PROFILE_DEV_DEBUG: "0"
  # linuxdeploy (AppImage) is itself an AppImage: no FUSE in containers.
  APPIMAGE_EXTRACT_AND_RUN: "1"
  NO_STRIP: "true"
  GRADLE_USER_HOME: $CI_PROJECT_DIR/.cache/gradle
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  # Faster cache/artifact transfer.
  FF_USE_FASTZIP: "true"
  ARTIFACT_COMPRESSION_LEVEL: fast
  CACHE_COMPRESSION_LEVEL: fast
  CACHE_POLICY: pull

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    # Tags come from the release jobs themselves; building them again would
    # only duplicate the pipeline that made them.
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # A branch with an open MR runs as the MR pipeline only.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    # The protected branches publish and write the caches others read.
    - if: $CI_COMMIT_BRANCH == $PROD_BRANCH && $CI_PIPELINE_SOURCE == "push"
      variables: { RELEASE_CHANNEL: prod, CACHE_POLICY: pull-push }
    - if: $CI_COMMIT_BRANCH == $DEV_BRANCH && $CI_PIPELINE_SOURCE == "push"
      variables:
        RELEASE_CHANNEL: dev
        CACHE_POLICY: pull-push
        # Pre-releases build fast: thin LTO across 16 codegen units runs in
        # parallel; releases from main keep full LTO and one unit (Cargo.toml).
        CARGO_PROFILE_RELEASE_LTO: thin
        CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    # Run pipeline / schedule: everything built, nothing published.
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "schedule"
      variables:
        FULL_PIPELINE: "true"
        CARGO_PROFILE_RELEASE_LTO: thin
        CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    - if: $CI_COMMIT_BRANCH

stages:
  - check
  - build
  - package
  - release

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

default:
  interruptible: true
  # Shared runners sometimes die under a job; that is not a red build.
  retry:
    max: 2
    when: [runner_system_failure, stuck_or_timeout_failure, scheduler_failure, api_failure]

sast:
  stage: check

secret_detection:
  stage: check

# ---------------------------------------------------------------- templates

# development, main, run pipeline, schedule: everything runs.
.full: &full
  if: $RELEASE_CHANNEL || $FULL_PIPELINE

.rust-rules:
  rules:
    - *full
    - changes:
        paths: [crates/**/*, Cargo.toml, Cargo.lock, clippy.toml, src/shared/api/ipc.gen.d.ts, .gitlab-ci.yml, scripts/ci/**/*, mise.toml]
        compare_to: refs/heads/development

.frontend-rules:
  rules:
    - *full
    - changes:
        paths: [src/**/*, index.html, package.json, pnpm-lock.yaml, "*.ts", "*.json", scripts/*.mjs, scripts/*.json, .gitlab-ci.yml, scripts/ci/**/*, mise.toml]
        compare_to: refs/heads/development

.ci-rules:
  rules:
    - *full
    - changes:
        paths: [.gitlab-ci.yml, scripts/ci/**/*, packaging/**/*]
        compare_to: refs/heads/development

# Builds only where something is published or asked for: never in feature or
# hotfix branches and MRs — those get the checks alone.
.build-rules:
  rules:
    - *full

# A job waits for the image only when this pipeline rebuilds it.
.image-needs: &image-needs
  job: ci:image
  optional: true

# Every check, and the version they will ship under: a red check stops the builds.
.build-needs:
  needs:
    - *image-needs
    - frontend:check
    - rust:fmt
    - rust:clippy
    - rust:test
    - ci:lint
    - version

.node:
  image: $CI_NODE_IMAGE
  needs: [*image-needs]
  variables:
    CI_SKIP_GUI_LIBS: "1"
    CI_MISE_TOOLS: node pnpm
  before_script:
    - source scripts/ci/setup-linux.sh
  cache:
    - &pnpm-cache
      key: pnpm-store
      paths: [.cache/pnpm]
      policy: $CACHE_POLICY

# Jobs that compile Rust for real: the bigger runner (CI_HEAVY_RUNNER_TAG).
.heavy:
  tags: [$CI_HEAVY_RUNNER_TAG]

.rust:
  image: $CI_LINUX_IMAGE
  needs: [*image-needs]
  variables:
    CI_MISE_TOOLS: rust
  before_script:
    - source scripts/ci/setup-linux.sh
    - mkdir -p dist # frontendDist for tauri::generate_context!; the UI is not built here

.cargo-cache: &cargo-cache
  key: cargo-registry
  paths: [.cache/cargo-registry]
  policy: $CACHE_POLICY

.publish:
  image: alpine:3.20
  interruptible: false
  before_script:
    - apk add --no-cache bash curl jq coreutils sed git

# ------------------------------------------------------------------- image

ci:image:
  stage: .pre
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: /certs
  rules:
    - changes: [scripts/ci/ci.Dockerfile, scripts/ci/apt-packages.sh, scripts/ci/image-tag.sh, scripts/ci/build-images.sh, mise.toml, .dockerignore]
    - if: $FORCE_CI_IMAGE
  before_script:
    - apk add --no-cache bash coreutils
  script:
    - scripts/ci/build-images.sh

# ------------------------------------------------------------------- check

frontend:check:
  extends: [.node, .frontend-rules]
  stage: check
  script:
    - mise run lint
    - mise run typecheck
    - mise run check-onboarding
    - mise run check-forms
    - mise run check-ui

ci:lint:
  extends: [.node, .ci-rules]
  stage: check
  variables:
    CI_MISE_TOOLS: node # no pnpm deps needed
  script:
    - scripts/ci/lint-ci.sh
  cache: []

rust:fmt:
  extends: [.rust, .rust-rules]
  stage: check
  before_script:
    - source scripts/ci/setup-linux.sh
  script:
    - cargo fmt --all -- --check

rust:clippy:
  extends: [.rust, .heavy, .rust-rules]
  stage: check
  script:
    - mise run clippy
  cache:
    - *cargo-cache
    - key: sccache-clippy
      paths: [.cache/sccache]
      policy: $CACHE_POLICY

rust:test:
  extends: [.rust, .heavy, .rust-rules]
  stage: check
  script:
    - mise run test
    # ipc.gen.d.ts is generated from Rust and must be committed up to date.
    - mise run gen-types
    - git diff --exit-code -- src/shared/api/ipc.gen.d.ts
  cache:
    - *cargo-cache
    - key: sccache-test
      paths: [.cache/sccache]
      policy: $CACHE_POLICY

# The version the builds ship under (dotenv BUILD_VERSION, ANDROID_VERSION_CODE),
# and the stop sign when it is already released.
version:
  extends: .build-rules
  stage: check
  image: $CI_NODE_IMAGE
  needs: [*image-needs]
  script:
    - scripts/ci/version.sh --channel "${RELEASE_CHANNEL:-none}" --dotenv build.env
  artifacts:
    reports:
      dotenv: build.env
    expire_in: 1 week

# ------------------------------------------------------------------- build

build:linux:
  extends: [.rust, .heavy, .build-rules, .build-needs]
  stage: build
  variables:
    CI_MISE_TOOLS: "" # node, pnpm and rust
  script:
    - scripts/ci/build-linux.sh "$BUILD_VERSION" release
  cache:
    - *cargo-cache
    - *pnpm-cache
    - key: sccache-linux-release
      paths: [.cache/sccache]
      policy: $CACHE_POLICY
  artifacts:
    name: multi-wallet-tracker-linux
    paths: [release/]
    expire_in: 2 weeks

build:windows:
  extends: [.build-rules, .build-needs]
  stage: build
  tags: [$WINDOWS_RUNNER_TAG]
  timeout: 2h
  script:
    - ./scripts/ci/build-windows.ps1 -OutDir release
  cache:
    - key: { prefix: windows-toolchain, files: [mise.toml] }
      paths: [.cache/rustup, .cache/cargo/bin, .cache/node-*, .cache/sccache-*.exe]
      policy: $CACHE_POLICY
    - key: windows-deps
      paths: [.cache/cargo/registry, .cache/pnpm]
      policy: $CACHE_POLICY
    - key: sccache-windows
      paths: [.cache/sccache]
      policy: $CACHE_POLICY
  artifacts:
    name: multi-wallet-tracker-windows
    paths: [release/]
    expire_in: 2 weeks

build:android:
  extends: [.rust, .heavy, .build-rules, .build-needs]
  image: $CI_ANDROID_IMAGE
  stage: build
  timeout: 2h
  variables:
    CI_SKIP_GUI_LIBS: "1"
    CI_MISE_TOOLS: "" # node, pnpm and rust
  before_script:
    - source scripts/ci/setup-linux.sh
    - source scripts/ci/setup-android.sh
  script:
    - scripts/ci/build-android.sh "$BUILD_VERSION" release
  cache:
    - *cargo-cache
    - *pnpm-cache
    - key: sccache-android
      paths: [.cache/sccache]
      policy: $CACHE_POLICY
    - key: gradle
      paths: [.cache/gradle/caches, .cache/gradle/wrapper]
      policy: $CACHE_POLICY
  artifacts:
    name: multi-wallet-tracker-android
    paths: [release/]
    expire_in: 2 weeks

# Universal .dmg (Apple Silicon + Intel). Off unless MACOS_BUILD is "true".
build:macos:
  extends: [.build-needs]
  stage: build
  image: $MACOS_IMAGE
  tags: [$MACOS_RUNNER_TAG]
  timeout: 2h
  rules:
    - if: $MACOS_BUILD != "true"
      when: never
    - *full # .build-rules
  script:
    - scripts/ci/build-macos.sh "$BUILD_VERSION" release
  cache:
    - key: macos-deps
      paths: [.cache/pnpm]
      policy: $CACHE_POLICY
  artifacts:
    name: multi-wallet-tracker-macos
    paths: [release/]
    expire_in: 2 weeks

# ----------------------------------------------------------------- package

# flatpak-builder needs bubblewrap: the runner must be privileged (GitLab.com
# shared runners are).
package:flatpak:
  extends: .build-rules
  stage: package
  image: $ARCH_IMAGE
  needs: [build:linux, version]
  cache:
    key: flatpak-gnome
    paths: [.flatpak-builder/downloads]
    policy: $CACHE_POLICY
  script:
    - scripts/ci/build-flatpak.sh "$BUILD_VERSION" release
  artifacts:
    name: multi-wallet-tracker-flatpak
    paths: [release/*.flatpak]
    expire_in: 2 weeks

package:pacman:
  extends: .build-rules
  stage: package
  image: $ARCH_IMAGE
  needs: [build:linux, version]
  script:
    - scripts/ci/build-pacman.sh "$BUILD_VERSION" release
  artifacts:
    name: multi-wallet-tracker-pacman
    paths: [release/*.pkg.tar.zst]
    expire_in: 2 weeks

# ----------------------------------------------------------------- release

.publish-needs:
  needs:
    - version
    - build:linux
    - build:windows
    - build:android
    - package:flatpak
    - package:pacman
    - job: build:macos
      optional: true

prerelease:
  extends: [.publish, .publish-needs]
  stage: release
  variables:
    GIT_DEPTH: "0" # the notes list every commit since the last release tag
  rules:
    - if: $RELEASE_CHANNEL == "dev"
  script:
    - scripts/ci/release.sh --pre "$BUILD_VERSION" release

# development pushes often: keep the newest PRERELEASES_KEPT pre-releases.
prerelease:cleanup:
  extends: .publish
  stage: release
  needs: [prerelease]
  allow_failure: true
  rules:
    - if: $RELEASE_CHANNEL == "dev"
  script:
    - scripts/ci/prune-prereleases.sh

release:
  extends: [.publish, .publish-needs]
  stage: release
  rules:
    - if: $RELEASE_CHANNEL == "prod"
  script:
    - scripts/ci/release.sh "$BUILD_VERSION" release

backmerge:
  extends: .publish
  stage: release
  needs: [release, version]
  allow_failure: true
  rules:
    - if: $RELEASE_CHANNEL == "prod"
  script:
    - scripts/ci/backmerge.sh "$BUILD_VERSION"

aur:publish:
  stage: release
  image: $ARCH_IMAGE
  interruptible: false
  rules:
    - if: $RELEASE_CHANNEL == "prod" && $AUR_SSH_PRIVATE_KEY
      when: manual
  needs: [build:linux, version, release]
  script:
    - scripts/ci/publish-aur.sh "$BUILD_VERSION" release
