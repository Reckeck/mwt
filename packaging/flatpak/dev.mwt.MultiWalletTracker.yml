# Flatpak of the CI-built Linux binary (repackaged, like Tauri's guide does
# with the .deb). CI puts the tarball next to this file as
# multi-wallet-tracker-linux-x86_64.tar.gz and clones flathub/shared-modules here.
# This is the dev app's; build-flatpak.sh renders the release's
# (mwt.app.MultiWalletTracker) from it.
#
#   flatpak-builder --user --install-deps-from=flathub --force-clean \
#     build-dir packaging/flatpak/dev.mwt.MultiWalletTracker.yml
id: dev.mwt.MultiWalletTracker
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: multi-wallet-tracker
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Reminders, the tray and the OS keyring that keeps the notification key.
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.secrets

modules:
  # The system tray (tauri tray-icon loads libayatana-appindicator at runtime).
  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json

  - name: multi-wallet-tracker
    buildsystem: simple
    sources:
      - type: archive
        path: multi-wallet-tracker-linux-x86_64.tar.gz
      - type: file
        path: dev.mwt.MultiWalletTracker.metainfo.xml
    build-commands:
      # The release ships multi-wallet-tracker, the dev app multi-wallet-tracker-dev.
      - install -Dm755 usr/bin/multi-wallet-tracker* /app/bin/multi-wallet-tracker
      - install -Dm644 usr/share/applications/*.desktop /app/share/applications/dev.mwt.MultiWalletTracker.desktop
      - desktop-file-edit --set-icon=dev.mwt.MultiWalletTracker --set-key=Exec --set-value=multi-wallet-tracker
        /app/share/applications/dev.mwt.MultiWalletTracker.desktop
      - |
        for size in 32x32 128x128; do
          install -Dm644 usr/share/icons/hicolor/$size/apps/*.png \
            /app/share/icons/hicolor/$size/apps/dev.mwt.MultiWalletTracker.png
        done
      - install -Dm644 dev.mwt.MultiWalletTracker.metainfo.xml /app/share/metainfo/dev.mwt.MultiWalletTracker.metainfo.xml
